 to learn most lessons from the experiences of others. Managers who have learned much from personal experience in the past usually are destined to learn much from personal experience in the future.", "zh": "诀窍在于尽量从他人的经验中吸取教训；那些过去全靠亲身踩坑才长记性的人，未来多半还得继续自己踩坑。", "source": "Berkshire Hathaway 1985 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "亲身试错的学费太贵，建立案例复盘库能让你少交 90% 的智商税。", "action": "记录一条最近在同行身上看到的教训，写进自己的避坑清单。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "雇佣比自己更强大的人", "en": "If each of us hires people who are smaller than we are, we shall become a company of dwarfs. But, if each of us hires people who are bigger than we are, we shall become a company of giants.", "zh": "如果我们每个人都雇佣比自己弱小的人，公司就会变成矮人国；如果我们都雇佣比自己更优秀的人，公司就会成为巨人之林。", "source": "Berkshire Hathaway 1986 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "自信的领导者敢于把比自己更专精的人才放在关键位置，并把功劳让给他们。", "action": "在下次招聘或组建项目组时，刻意寻找在某个维度明显强过你的人。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "只与你喜欢、信任和钦佩的人共事", "en": "We intend to continue our practice of working only with people whom we like and admire... working with people who cause your stomach to churn seems much like marrying for money - probably a bad idea under any circumstances, but absolute madness if you are already rich.", "zh": "我们坚持只与自己喜欢和钦佩的人共事。和让你反胃的人合作就像为了钱结婚——任何时候都是馊主意，衣食无忧后更是彻底疯狂。", "source": "Berkshire Hathaway 1986 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "与品行不正的人做生意，你永远算不过他，而且每天都不开心。", "action": "审视当前的合作伙伴名单，把精力优先分配给值得信任的同路人。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "在别人贪婪时恐惧，在别人恐惧时贪婪", "en": "We simply attempt to be fearful when others are greedy and to be greedy only when others are fearful.", "zh": "我们只是努力在别人贪婪时保持恐惧，在别人恐惧时变得贪婪。", "source": "Berkshire Hathaway 1986 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "情绪周期是市场永不枯竭的套利来源，逆向纪律让你在极端时刻捡到筹码。", "action": "感受一下当前周围的情绪温度：大家是在盲目狂热，还是过度悲观？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "好公司最怕频繁折腾与剧变", "en": "Severe change and exceptional returns usually don't mix... Experience, however, indicates that the best business returns are usually achieved by companies that are doing something quite similar today to what they were doing five or ten years ago.", "zh": "剧烈变化与卓越回报通常水火不容。最赚钱的企业，今天做的事情往往和五年前、十年前非常相似。", "source": "Berkshire Hathaway 1987 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "在不断推倒重来的行业里，护城河很难沉淀；稳定复利往往来自看似“枯燥”的重复。", "action": "思考你核心业务中，哪些基础动作 5 年后依然成立并值得持续打磨？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "把平凡的事做到极致就是非凡", "en": "Our managers have produced extraordinary results by doing rather ordinary things - but doing them exceptionally well.", "zh": "我们的管理者之所以创造了非凡业绩，是因为他们做着相当平凡的事情，却把它们做到了极致。", "source": "Berkshire Hathaway 1987 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "商业竞争很少靠秘密武器，90% 的胜负取决于基本功的执行精度。", "action": "挑出今天最重要的一项基础工作，把它做到比平常高出一个档次。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "宁要崎岖的 15%，不要平滑的 12%", "en": "Charlie and I always have preferred a lumpy 15% return to a smooth 12%.", "zh": "查理和我永远宁愿要波动不平的 15% 回报，也不要平滑稳定的 12% 回报。", "source": "Berkshire Hathaway 1990 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "华尔街为了迎合季度平滑报表往往牺牲长期价值，敢于承受短期波动是巨大优势。", "action": "别为了短期数据好看而放弃长期净现值更高的正确方案。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "市场先生是仆人，不是导师", "en": "Mr. Market is there to serve you, not to guide you. It is his pocketbook, not his wisdom, that you will find useful.", "zh": "市场先生是来为你服务的，而不是来指导你的。对你有用的是他的钱包，而不是他的智慧。", "source": "Berkshire Hathaway 1987 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "每天的报价只反映市场情绪，不代表企业真实价值；用它来买卖，别被它洗脑。", "action": "今天看行情或外部评价时，提醒自己它们只是情绪报价，不是真理。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "短期是投票机，长期是称重机", "en": "In the short run, the market is a voting machine but in the long run it is a weighing machine.", "zh": "短期来看，市场是一台投票机；但长期来看，它是一台精准的称重机。", "source": "Berkshire Hathaway 1987 Letter (引自 Ben Graham)", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "短期热度和流量决定投票，但最终决定重量的永远是盈利能力与用户价值。", "action": "把注意力从短期曝光或波动，拉回到长期实打实的价值积累上。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "独立思考与能力圈的铁律", "en": "Indeed, if you aren't certain that you understand and can value your business far better than Mr. Market, you don't belong in the game. As they say in poker, 'If you've been in the game 30 minutes and you don't know who the patsy is, you're the patsy.'", "zh": "如果你不能确定自己比市场先生更懂手里的生意，那你不该上桌。牌桌上常说：玩了半小时还不知道谁是傻瓜，那你自己就是傻瓜。", "source": "Berkshire Hathaway 1987 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "在信息不对等或完全陌生的游戏里，最好的策略是不下场。", "action": "远离你看不懂规则、全靠听消息跟风的局。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不要仅仅因为赚钱了就卖出好资产", "en": "Of Wall Street maxims the most foolish may be 'You can't go broke taking a profit.'", "zh": "华尔街最愚蠢的格言或许就是：“落袋为安永远不会破产。”", "source": "Berkshire Hathaway 1987 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "过早卖掉正在复利奔跑的超级赢家，是投资中最大的隐性踏空成本。", "action": "对于核心优质资产或长期赛道，保持足够的耐心让复利充分发酵。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不要把时间浪费在盯盘上", "en": "What's the sense in getting rich just to stare at a ticker tape all day?", "zh": "如果变富的代价是整天死死盯着行情报价屏幕，那还有什么意义呢？", "source": "Berkshire Hathaway 1988 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "投资和工作的目的是赢得时间自由与心灵平静，而不是成为屏幕的奴隶。", "action": "减少今天刷实时数据或行情软件的次数，把时间还给深度思考。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不跟风任何宏观预测，只看长期经济规律", "en": "We do not have, never have had, and never will have an opinion about where the stock market, interest rates, or business activity will be a year from now.", "zh": "对于一年后股市、利率或经济活跃度会走到哪里，我们现在没有、过去从未有过、将来也永远不会有观点。", "source": "Berkshire Hathaway 1988 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "把精力花在预测不可知变量上，不如用来评估具体企业未来十年的竞争壁垒。", "action": "屏蔽今天看到的任何一年期指数预测文章。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "买入后长期持有的巨大复利与税收优势", "en": "If, however, we made a single fantastic investment that itself doubled 20 times during the 20 years, our dollar would grow to $1,048,576... The sole reason for this staggering difference in results would be the timing of tax payments.", "zh": "如果做一笔极佳的长期投资让 1 美元在 20 年里翻倍 20 次，税后结果与频繁买卖的差距高达 27 倍——唯一原因就是延迟纳税的复利威力。", "source": "Berkshire Hathaway 1989 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "频繁换手不仅损耗交易摩擦，更在不断打断复利滚雪球。", "action": "检查你最核心的长期资产，问自己是否因为短期波动而过度折腾。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "警惕忽略资本支出的伪指标（EBITDA）", "en": "At 95% of American businesses, capital expenditures that over time roughly approximate depreciation are a necessity and are every bit as real an expense as labor or utility costs.", "zh": "在 95% 的美国企业中，长期来看接近折旧额的资本支出是维持生存的必需品，它和人工、水电一样是实打实的真金白银成本。", "source": "Berkshire Hathaway 1989 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "谈利润时绝不能假装机器设备不会老化、不需要花钱更新。", "action": "看重资产项目报表时，务必把维持性资本支出从现金流里扣除。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "厨房里绝不会只有一只蟑螂", "en": "In a difficult business, no sooner is one problem solved than another surfaces - never is there just one cockroach in the kitchen.", "zh": "在艰难的生意里，刚解决一个问题，另一个问题马上冒出来——厨房里绝不会只有一只蟑螂。", "source": "Berkshire Hathaway 1989 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "问题频发的企业往往源于底层商业模式或治理文化出了系统性故障。", "action": "遇到连续三次出现低级失误的合作方或业务，果断重新评估整体合作。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "悲观情绪是理性买家的朋友", "en": "The most common cause of low prices is pessimism - some times pervasive, some times specific to a company or industry. We want to do business in such an environment, not because we like pessimism but because we like the prices it produces. It's optimism that is the enemy of the rational buyer.", "zh": "低价最常见的原因是悲观情绪。我们喜欢在悲观环境里做交易，不是因为喜欢悲观，而是喜欢它带来的低价；盲目乐观才是理性买家的敌人。", "source": "Berkshire Hathaway 1990 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "好公司遇到暂时性逆风和悲观情绪时，往往才是难得的出手机会。", "action": "列出 1-2 家你长期看好但近期市场情绪偏冷的优质标的。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "独立思考而非盲从大众", "en": "None of this means, however, that a business or stock is an intelligent purchase simply because it is unpopular; a contrarian approach is just as foolish as a follow-the-crowd strategy. What's required is thinking rather than polling.", "zh": "仅仅因为不受欢迎就买入，和盲目跟风一样愚蠢；真正需要的是独立思考，而不是搞民意调查。", "source": "Berkshire Hathaway 1990 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "逆向不是为了与众不同而反着买，而是只看事实与逻辑是否成立。", "action": "做决定时，屏蔽“大家都在买/都在卖”的噪音，只看自己的逻辑清单。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "投资的三个核心词：安全边际", "en": "Confronted with a challenge to distill the secret of sound investment into three words, we venture the motto, Margin of Safety. Forty-two years after reading that, I still think those are the right three words.", "zh": "如果要求把稳健投资的秘诀浓缩成三个词，那就是：安全边际（Margin of Safety）。", "source": "Berkshire Hathaway 1990 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "给未来留足出错缓冲，即使判断偏了 30%，依然不会伤筋动骨。", "action": "给今天手上的重要计划留出 20% 以上的时间或预算安全边际。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "特许经营权（Franchise）的三条标准", "en": "An economic franchise arises from a product or service that: (1) is needed or desired; (2) is thought by its customers to have no close substitute and; (3) is not subject to price regulation.", "zh": "经济特许经营权来自这样的产品或服务：人们需要或渴望它、顾客认为没有近似替代品、且不受价格管制。", "source": "Berkshire Hathaway 1991 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "真正的特许经营权甚至能容忍一定程度的管理失误而不伤及根基。", "action": "用这三条标准给你的核心业务或产品打个分。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "适度集中才是最好的风险控制", "en": "It is a mistake to think that one limits one's risk by spreading too much between enterprises about which one knows little and has no reason for special confidence.", "zh": "以为把资金分散到一大堆自己不太了解的企业里就能降低风险，这是一个严重的错误。", "source": "Berkshire Hathaway 1991 Letter (引自 Keynes)", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "把蛋放进少数几个你看得极其透彻并严密看管的篮子里，远比盲目分散更安全。", "action": "盘点你同时推进的项目数量：是不是战线拉得太长而分散了火力？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "预测者存在的唯一价值", "en": "We've long felt that the only value of stock forecasters is to make fortune tellers look good. Even now, Charlie and I continue to believe that short-term market forecasts are poison and should be kept locked up in a safe place, away from children and also from grown-ups who behave in the market like children.", "zh": "股票预测师存在的唯一价值，就是让算命先生看起来更体面。短期市场预测是毒药，应该锁在远离孩子和心智如孩童般成年人的保险柜里。", "source": "Berkshire Hathaway 1992 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "越是斩钉截铁预测下个月点位的人，越不值得把真金白银托付给他。", "action": "今天不听任何关于短期涨跌的“专家预测”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "价值与成长本是一体两面", "en": "In our opinion, the two approaches are joined at the hip: Growth is always a component in the calculation of value, constituting a variable whose importance can range from negligible to enormous and whose impact can be negative as well as positive.", "zh": "价值与成长本就是连体婴：成长永远是计算内在价值时的一个变量，它的影响既可能是正面的，也可能是毁灭性的。", "source": "Berkshire Hathaway 1992 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "只有资本回报率高于资本成本的增长才创造价值，否则越增长越亏钱。", "action": "分辨某个增长机会是“高回报复利增长”，还是“烧钱换规模”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "认清自己不知道什么比知道什么更重要", "en": "What counts for most people in investing is not how much they know, but rather how realistically they define what they don't know. An investor needs to do very few things right as long as he or she avoids big mistakes.", "zh": "对大多数投资者而言，重要的不是你知道多少，而是你能否清醒地界定自己“不知道什么”。只要避开大错，只需做对寥寥几件事就够了。", "source": "Berkshire Hathaway 1992 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "把精力守在能力圈的已知区，大错自然无从发生。", "action": "写下一件你明确决定“不碰、不参与”的事情。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "把狗尾巴叫做腿，它依然只有四条腿", "en": "Managers thinking about accounting issues should never forget one of Abraham Lincoln's favorite riddles: 'How many legs does a dog have if you call his tail a leg?' The answer: 'Four, because calling a tail a leg does not make it a leg.'", "zh": "林肯最爱的谜语：如果你把狗尾巴叫做腿，狗有几条腿？答案是四条——因为你叫它腿，它也不会变成腿。", "source": "Berkshire Hathaway 1992 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "任何财务粉饰或口径调整，都无法改变真实的现金流与经济现实。", "action": "穿透一个被美化过的指标，看看底层最真实的转化与现金流。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "庞大的总部开销直接吞噬企业价值", "en": "Charlie and I have observed no correlation between high corporate costs and good corporate performance. In fact, we see the simpler, low-cost operation as more likely to operate effectively than its bureaucratic brethren.", "zh": "高昂的总部管理费用与优异业绩之间毫无正相关。相反，更精简、低成本的组织往往比官僚庞大的同行高效得多。", "source": "Berkshire Hathaway 1992 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "每一分浪费在总部排场上的钱，都在按市盈率倍数蒸发公司市值。", "action": "检查你所在团队有没有一项纯属形式主义的开支或会议。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "宁要模糊的正确，不要精确的错误", "en": "In their hunger for a single statistic to measure risk, however, they forget a fundamental principle: It is better to be approximately right than precisely wrong.", "zh": "在渴望用一个单一统计数字衡量风险时，人们忘了一条基本原则：宁要模糊的正确，也不要精确的错误。", "source": "Berkshire Hathaway 1993 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "把心思花在定性护城河与粗略估值区间上，胜过在小数点后两位上自欺欺人。", "action": "用粗略但关键的 3 个估算区间代替繁琐的伪精确表格。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "指数基金对非专业投资者的巨大威力", "en": "By periodically investing in an index fund, for example, the know-nothing investor can actually out-perform most investment professionals. Paradoxically, when 'dumb' money acknowledges its limitations, it ceases to be dumb.", "zh": "通过定期定额投资低费率指数基金，一个“什么都不懂”的投资者实际上能跑赢大多数专业基金经理。当“笨钱”承认自身局限时，它就不再笨了。", "source": "Berkshire Hathaway 1993 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "承认局限、降低费率、长期持有，是最朴素也最强大的个人配置策略。", "action": "核对一下你当前理财或投资组合的管理费率是否过高。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "像泰德·威廉姆斯一样等好球再挥棒", "en": "Ted Williams, in The Story of My Life, explains why: 'My argument is, to be a good hitter, you've got to get a good ball to hit. It's the first rule in the book.' Charlie and I agree and will try to wait for opportunities that are well within our own 'happy zone.'", "zh": "泰德·威廉姆斯说：要想成为优秀击球手，必须等好球进入最佳甜区再挥棒。投资没有三振出局，你可以一直等下去。", "source": "Berkshire Hathaway 1994 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "资本市场没有强制挥棒的规则，耐心等待十拿九稳的甜区机会。", "action": "对今天遇到的一个“勉强还行”的机会说不，把精力留给甜区机会。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "不需要做非凡的事就能获得非凡结果", "en": "Ben Graham taught me 45 years ago that in investing it is not necessary to do extraordinary things to get extraordinary results. In later life, I have been surprised to find that this statement holds true in business management as well. What a manager must do is handle the basics well and not get diverted.", "zh": "格雷厄姆教导我：投资无需做非凡之举就能获得非凡成果。后来我发现企业管理也是如此——管理者只需把基础工作做好、不被杂念带偏。", "source": "Berkshire Hathaway 1994 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "聚焦主业、打磨基本功、抵抗盲目扩张的诱惑，时间自会给答案。", "action": "列出今天最重要的 3 件基本功，不受干扰地先把它们做完。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不要因为“做交易很刺激”而盲目并购", "en": "Peter Drucker got to the heart of things: 'I will tell you a secret: Dealmaking beats working. Dealmaking is exciting and fun, and working is grubby... that's why you have deals that make no sense.'", "zh": "彼得·德鲁克一针见血：做交易比苦干日常运营刺激多了，这就是为什么市场上充斥着毫无商业意义的愚蠢并购。", "source": "Berkshire Hathaway 1995 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "警惕“为了交易而交易”的肾上腺素冲动，永远和手头的现存机会比回报率。", "action": "检查你最近想推动的新合作：是因为它真的划算，还是仅仅因为新鲜刺激？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "打鼾时赚的钱比折腾时更多", "en": "Our portfolio shows little change: We continue to make more money when snoring than when active. Inactivity strikes us as intelligent behavior.", "zh": "我们的投资组合几乎没怎么动：我们打鼾时赚的钱继续比忙着交易时多得多。保持不动在我们看来是一种智慧。", "source": "Berkshire Hathaway 1996 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "买对好资产后，最大的贡献就是克制自己不要频繁去动它。", "action": "给你的核心长期布局多一点“静待花开”的耐心。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不愿意持有十年，就不要持有一分钟", "en": "If you aren't willing to own a stock for ten years, don't even think about owning it for ten minutes.", "zh": "如果你不愿意持有一家公司的股票十年，那就连十分钟也不要持有它。", "source": "Berkshire Hathaway 1996 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "把时间刻度拉长到十年，90% 的短期噪音和伪逻辑都会自动现形。", "action": "用“十年后它还会更好吗”来检验你手头最重要的投入。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "不要因为一只股票涨太多就卖掉你的“乔丹”", "en": "To suggest that this investor should sell off portions of his most successful investments simply because they have come to dominate his portfolio is akin to suggesting that the Bulls trade Michael Jordan because he has become so important to the team.", "zh": "仅仅因为最成功的投资在组合里占比变大就卖掉它，就像建议公牛队因为迈克尔·乔丹太重要而把他交易走一样荒谬。", "source": "Berkshire Hathaway 1996 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "优秀的资产自然会成长为组合的主力，不要人为修剪鲜花而保留杂草。", "action": "把更多时间与资源倾斜给你已经验证出最强复利的“核心王牌”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "净买入者应该希望价格下跌，而不是上涨", "en": "Even though they are going to be net buyers of stocks for many years to come, they are elated when stock prices rise and depressed when they fall. In effect, they rejoice because prices have risen for the 'hamburgers' they will soon be buying. This reaction makes no sense.", "zh": "明明未来多年都是股票的净买家，却在股价上涨时欢呼、下跌时沮丧——这就像一个天天要买汉堡的人为汉堡涨价而庆祝一样荒唐。", "source": "Berkshire Hathaway 1997 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "只要你还在持续积累优质资产，市场打折永远是你的好朋友。", "action": "换个角度看待近期的资产或行业回调：有没有好东西变便宜了？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "像唯一家族资产一样经营企业百年", "en": "Just run your business as if: 1) you own 100% of it; 2) it is the only asset in the world that you and your family have or will ever have; and 3) you can't sell or merge it for at least a century.", "zh": "像这样经营你的业务：假装你拥有它 100% 的股权，它是你和家人唯一的资产，且未来一百年都不能卖掉或合并它。", "source": "Berkshire Hathaway 1998 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "一旦以百年视角做决策，所有杀鸡取卵、透支品牌信誉的短视动作都会立刻停止。", "action": "用“如果我要守这项事业 20 年”的视角，重审今天的策略。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "追求本质，而不是追求“被如何记账”", "en": "We want our managers to think about what counts, not how it will be counted.", "zh": "我们希望管理者思考什么才是真正重要的价值，而不是纠结它在报表上会被怎么记账。", "source": "Berkshire Hathaway 1998 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "不要为了迎合短期的 KPI 口径，而做出损害长期真实价值的变形动作。", "action": "检查今天的工作重心：是在创造真实价值，还是在修饰考核数字？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "回购股票的两大铁律", "en": "There is only one combination of facts that makes it advisable for a company to repurchase its shares: First, the company has available funds -- cash plus sensible borrowing capacity -- beyond the near-term needs of the business and, second, finds its stock selling in the market below its intrinsic value, conservatively-calculated.", "zh": "企业回购股票只有在同时满足两个条件时才明智：手里有超出近期经营所需的充裕资金，且股价明显低于保守估算的内在价值。", "source": "Berkshire Hathaway 1999 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "不看估值盲目回购是毁灭现金，低估时果断回购则是送给留守股东的礼物。", "action": "评估你关注的公司回购行为：它是在低估时捡便宜，还是在掩盖期权稀释？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "泡沫破裂前的时钟没有指针", "en": "Nothing sedates rationality like large doses of effortless money... They know that overstaying the festivities will eventually bring on pumpkins and mice... Therefore, the giddy participants all plan to leave just seconds before midnight. There's a problem, though: They are dancing in a room in which the clocks have no hands.", "zh": "没有什么比来得太容易的大把钞票更能麻醉理性。狂欢者都计划在午夜钟声敲响前几秒离场，但问题在于：他们跳舞的房间里，时钟根本没有指针。", "source": "Berkshire Hathaway 2000 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "不要幻想自己能精准逃顶，泡沫里最安全的方式是从一开始就不参与击鼓传花。", "action": "远离全靠“下一个人会以更高价接盘”才能成立的投资逻辑。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "关注“风险敞口”而非仅仅关注“历史经验”", "en": "In short, all of us in the industry made a fundamental underwriting mistake by focusing on experience, rather than exposure, thereby assuming a huge terrorism risk for which we received no premium.", "zh": "我们犯了一个根本性的承保错误：只盯着过去的历史经验，而忽略了真实的潜在风险敞口。", "source": "Berkshire Hathaway 2001 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "过去十年没发生过，不代表结构上不存在极端的黑天鹅敞口。", "action": "排查你的业务或财务里，有没有“从未发生但一旦发生就致命”的风险敞口。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "注脚越晦涩，越要警惕管理层", "en": "Second, unintelligible footnotes usually indicate untrustworthy management. If you can't understand a footnote or other managerial explanation, it's usually because the CEO doesn't want you to.", "zh": "晦涩难懂的财务附注通常意味着不值得信任的管理层——如果你看不懂某段解释，多半是因为 CEO 根本不想让你看懂。", "source": "Berkshire Hathaway 2002 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "真正诚实且心里有底的管理者，总能用最平实清晰的大白话讲清生意。", "action": "遇到用复杂术语绕圈子的汇报或项目说明书，直接保持警惕。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "独立董事的核心职责：选对人并合理定薪", "en": "These two all-important functions are, first, to obtain (or retain) an able and honest manager and then to compensate that manager fairly.", "zh": "董事会最核心的两项职责：第一是找到并留住能干且诚实的管理者，第二是给予其公平合理的薪酬激励。", "source": "Berkshire Hathaway 2003 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "公司治理不需要繁文缛节，选对人、给对激励就解决了 90% 的问题。", "action": "审视你团队核心骨干的激励机制是否真正与长期价值对齐。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "独立变量越多，系统成功概率越低", "en": "If only one variable is key to a decision, and the variable has a 90% chance of going your way, the chance for a successful outcome is obviously 90%. But if ten independent variables need to break favorably for a successful result, and each has a 90% probability of success, the likelihood of having a winner is only 35%.", "zh": "如果一件事只取决于 1 个成功概率 90% 的变量，总胜率是 90%；但如果必须同时满足 10 个各 90% 概率的独立条件，总胜率会骤降到 35%。", "source": "Berkshire Hathaway 2004 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "链条越长、依赖条件越多的计划，在现实中越容易出岔子。", "action": "精简你当前方案的依赖前提，尽量依赖少而硬的核心变量。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Tom Murphy", "initials": "TM", "title": "雇佣一个 2 万美元的助理，其实是 300 万美元的决定", "en": "The employee assumed that adding $20,000 to the annual payroll would be inconsequential. But his boss told him the proposal should be evaluated as a $3 million decision, given that an additional person would probably cost at least that amount over his lifetime.", "zh": "员工以为每年多花 2 万美元雇个助理无足轻重，但墨菲告诉他：考虑到加薪、福利、办公空间和全生命周期成本，这其实是一个 300 万美元的决策。", "source": "Berkshire Hathaway 2004 Letter (引自 Tom Murphy)", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "固定人力成本一旦加上去就极难逆转，人员编制永远要精打细算。", "action": "新增任何固定岗位或长期订阅开支前，先按 5-10 年总成本来评估。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "兴奋与交易成本是投资者的两大敌人", "en": "Investors should remember that excitement and expenses are their enemies.", "zh": "投资者应该永远记住：情绪亢奋和交易摩擦成本，是你最大的两个敌人。", "source": "Berkshire Hathaway 2004 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "好的投资往往枯燥得像看着油漆慢慢变干，追求刺激只会多交手续费。", "action": "检查自己最近有没有因为“手痒想找点刺激”而做出不必要的操作。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "宁愿非传统地成功，也不要随大流地失败", "en": "John Maynard Keynes said in his masterful The General Theory: 'Worldly wisdom teaches that it is better for reputation to fail conventionally than to succeed unconventionally.' (Or, to put it less elegant terms, lemmings as a class may be derided but never does an individual lemming get criticized.)", "zh": "凯恩斯说：世俗智慧教导人们，墨守成规地失败比标新立异地成功更有利于保住名声——就像旅鼠群体会被嘲笑，但从没有哪一只旅鼠会单独挨骂。", "source": "Berkshire Hathaway 2004 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "机构和职场里充满了“为了不背锅而做平庸决策”的人，这正是独立思考者的机会。", "action": "今天面对一个更正确但略显孤独的方案时，鼓起勇气坚持事实。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "顾客第一、员工第二、股东第三的长期主义", "en": "Sol placed the highest priority on delivering the best possible deal to the consumer and providing excellent wages and benefits to employees. He said that the customer comes first, the employees second and the shareholders third.", "zh": "索尔把为顾客提供最划算的商品放在第一位，把优厚的员工薪酬福利放在第二位，股东放在第三位——结果股东却赚得盆满钵满。", "source": "Robert Price《Sol Price》", "url": "https://blas.com/sol-price/", "insight": "把顾客和一线员工的利益放在首位，护城河自然会厚到对手望尘莫及。", "action": "在下一个产品或服务迭代中，先问“这对用户和一线团队真的更好吗？”"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "不靠繁华广告，靠会员费绑定信任飞轮", "en": "In addition, the membership concept helped reduce operating expenses for the business because the membership psychologically tied the member to Price Club and eliminated the need to advertise.", "zh": "会员制不仅让商品毛利可以压到极低，还从心理上把会员与卖场绑定在一起，彻底省去了巨额广告费用。", "source": "《Sol Price》Summary", "url": "https://blas.com/sol-price/", "insight": "把原本要交给广告平台的钱，通过会员制直接补贴成商品低价，形成完美闭环。", "action": "思考如何用更好的产品体验代替昂贵的外部买量广告。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Henry Singleton", "initials": "HS", "title": "不为自己设限的自由思考时间", "en": "I don't reserve any day-to-day responsibilities for myself, so I don't get into any particular rut. I do not define my job in any rigid terms but in terms of having the freedom to do whatever seems to be in the best interests of the company at any time.", "zh": "我不给自己保留任何日常琐碎职责，以免陷入固定套路。我从不僵化定义自己的工作，只保留在任何时刻去做对公司最有利之事的自由。", "source": "William N. Thorndike《The Outsiders》", "url": "https://typeshare.co/Nauman/posts/the-outsiders-eight-unconventional-ceos-and-their-radically-rational-blueprint-for-success", "insight": "最高效的领导者必须从日常救火中抽身，把黄金时间留给战略与资本配置。", "action": "今天为自己划出 1 小时完全不被打扰的“自由战略思考时间”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "保持耐心与延迟满足", "en": "It's waiting that helps you as an investor and a lot of people just can't stand to wait. If you didn't get the deferred-gratification gene, you've got to work very hard to overcome that.", "zh": "在投资中真正帮到你的是等待，而绝大多数人根本忍受不了等待。如果你天生缺乏延迟满足的基因，就必须后天拼命克服它。", "source": "Charlie Munger, Wall Street Journal Interview 2014", "url": "https://observer.com/2023/11/charlie-munger-quotes-life-business-morality/", "insight": "大多数亏损都源于“等不及”而提前下手或提前离场。", "action": "把一个让你急于求成的决定刻意延后 48 小时再拍板。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Charlie Munger", "initials": "CM", "title": "永远走高尚的那条路，那里一点也不拥挤", "en": "Always take the high road, it's far less crowded.", "zh": "永远选择更高尚、更正直的那条路，因为那条路上一点也不拥挤。", "source": "Daily Journal Annual Meeting 2020", "url": "https://observer.com/2023/11/charlie-munger-quotes-life-business-morality/", "insight": "正直与长期主义在短期看似吃亏，长期却拥有最低的竞争密度和最高的信任复利。", "action": "在今天的利益取舍中，毫不犹豫地选择更坦荡、更长远的方案。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "财富的真正意义是独立与自由", "en": "Like Warren, I had a considerable passion to get rich, not because I wanted Ferraris—I wanted the independence. I desperately wanted it.", "zh": "和沃伦一样，我年轻时也极度渴望致富——不是为了买法拉利，而是为了获得独立自主。我无比渴望那种自由。", "source": "《Buffett: The Making of an American Capitalist》", "url": "https://observer.com/2023/11/charlie-munger-quotes-life-business-morality/", "insight": "金钱的最高回报，是让你拥有对不喜欢的人和事说“不”的底气。", "action": "提醒自己积累财富与能力的初心：是为了自由，而不是为了攀比消费。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "第一条原则：永远不要亏钱", "en": "Rule No.1: Never lose money. Rule No.2: Never forget rule No.1.", "zh": "第一条规则：永远不要亏钱。第二条规则：永远不要忘记第一条。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "本金永久性损失一旦发生，需要极高倍数才能回本；风控永远排在收益之前。", "action": "任何决策前先算清楚最坏情况下会损失多少本金。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "股市是把钱从急躁者转移到耐心者手里的机器", "en": "The stock market is a device for transferring money from the impatient to the patient.", "zh": "股市是一个将财富从没有耐心的人手里转移到有耐心的人手里的装置。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "耐心本身就是一种可量化的套利能力。", "action": "对看准的长期目标，多给它一点时间兑现。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "前人栽树，后人乘凉", "en": "Someone is sitting in the shade today because someone planted a tree a long time ago.", "zh": "今天有人能坐在树荫下乘凉，是因为很久以前有人栽下了一棵树。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "所有伟大的复利成果，都源自几年前甚至几十年前播下的种子。", "action": "今天种下一颗需要 3-5 年才能长成大树的小行动。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "与比自己更优秀的人同行", "en": "It's better to hang out with people better than you. Pick out associates whose behavior is better than yours, and you'll drift in that direction.", "zh": "最好和比你更优秀的人待在一起。挑选那些行为品格比你更好的人为伍，你也会自然朝那个方向成长。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "环境与同行者会潜移默化地重塑你的标准与习惯。", "action": "本周主动约一位在某方面明显比你优秀的朋友交流一次。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "最好的投资是投资你自己", "en": "The most important investment you can make is in yourself.", "zh": "你能做的最重要的一笔投资，就是投资你自己。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "自身能力与认知是任何通胀都无法夺走、任何税率都无法征收的资产。", "action": "把今天的一小块预算或时间，用来打磨一项核心技能。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "风险来自你不知道自己在做什么", "en": "Risk comes from not knowing what you're doing.", "zh": "真正的风险，来自于你不知道自己在做什么。", "source": "Warren Buffett 经典格言", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "波动不是风险，无知才是风险。", "action": "在不懂的领域里，先花时间搞懂规则再决定是否下场。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "我们最喜欢的持有期限是“永远”", "en": "Our favorite holding period is forever.", "zh": "我们最喜欢的持有期限是“永远”。", "source": "Berkshire Hathaway 1988 Letter", "url": "https://www.quora.com/What-are-the-most-memorable-phrases-from-Warren-Buffetts-annual-letters", "insight": "寻找那些护城河足够深、管理层足够可靠，值得一直伴随成长的事业。", "action": "检查你手头的核心资产：哪一项值得你以十年以上尺度去陪伴？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "保持终身学习的热爱", "en": "The game is to keep learning, and I don't think people are going to keep learning who don't like the learning process.", "zh": "这场游戏的秘诀就是不断学习；如果一个人不喜欢学习的过程，他是很难一直学下去的。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "把好奇心变成乐趣，而不是苦差事，才能跑赢一辈子。", "action": "选一个你真正好奇的问题，享受花 15 分钟彻底搞懂它的过程。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "基础扎实，新知识才学得少", "en": "The more basic knowledge you have, the less new knowledge you have to get.", "zh": "你掌握的基础底层知识越扎实，需要重新死记硬背的新知识就越少。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "万物皆有底层共通结构，抓牢第一性原理能以一驭万。", "action": "遇到新现象时，先尝试用最基础的供需或人性原理来解释它。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "极端政治敌意会损害聪明人的大脑", "en": "Intense political animosity should be avoided because it causes much mental malfunction, even in brilliant brains.", "zh": "应当避免陷入强烈的党派或意识形态敌意，因为它哪怕在最聪明的大脑里也会引发严重的认知失灵。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "保持冷静旁观者的客观视角，才能看清利益与事实的真实走向。", "action": "遇到极具争议的话题时，刻意保持情绪中立，只看客观数据。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "世界本身是高度互联的复杂系统", "en": "You have to realize the truth of biologist Julian Huxley's idea that, 'Life is just one damn relatedness after another.' So you must have the models, and you must see the relatedness and the effects from the relatedness.", "zh": "生命就是一连串没完没了的相互关联。你必须拥有思维模型，并看清事物之间的关联以及关联引发的连锁效应。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "孤立看单个指标很容易误判，必须把变量放回整个生态系统里看联动。", "action": "画一张简单的因果关联图，看看今天决策会牵动哪几个相关方。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "组织在一件事上犯傻，往往在别处也一样", "en": "A rough rule in life is that an organization foolish in one way in dealing with a complex system is all too likely to be foolish in another.", "zh": "一条粗糙但管用的经验法则是：一个组织在处理复杂系统时若在某方面显得很愚蠢，那它在另一方面多半也很愚蠢。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "组织文化与治理水准是高度一致的，小处见大。", "action": "观察合作团队在日常细节上的严谨度，以此判断其整体可靠性。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "跨界抓取真正管用的大理念", "en": "I couldn't stand reaching for a small idea in my own discipline when there was a big idea right over the fence in somebody else's discipline. So I just grabbed in all directions for the big ideas that would really work.", "zh": "当隔壁学科的篱笆外就躺着一个管用的大理念时，我无法忍受在自己专业里抠一个小点子——我向四面八方抓取真正管用的大理念。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "不要被专业身份限制，实用与真理才是最重要的边界。", "action": "今天看一篇完全不属于你本行领域的深度文章。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "一旦尝到跨学科综合的甜头，就再也回不去", "en": "If you skillfully follow the multidisciplinary path, you will never wish to come back. It would be like cutting off your hands.", "zh": "如果你熟练走上了跨学科综合思考的道路，你永远不会想退回老路——那就像砍掉自己的双手一样难以忍受。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "多维度视角带来的洞察力降维打击，会让你对思考本身上瘾。", "action": "把今天遇到的业务难题，用至少两个学科的语言重新描述一遍。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "更新更锋利的思维工具，随时替换旧工具", "en": "When a better tool (idea or approach) comes along, what could be better than to swap it for your old, less useful tool?", "zh": "当一个更好的工具（理念或方法）出现时，还有什么比用它替换掉你手里旧的、没那么好用的工具更划算的呢？", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "不要对旧方法产生感情包袱，迭代工具箱是终身成长的标志。", "action": "淘汰一个你最近明显觉得低效的工作习惯，换成更优解。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "生物本能偏好省力与厌恶丧失", "en": "Biological creatures ordinarily prefer effort minimization in routine activities and don't like removals of long-enjoyed benefits.", "zh": "生物体在日常活动中本能地倾向于省力，并且极度厌恶被剥夺长期享有的既得利益。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "理解损失厌恶与路径依赖，能帮你更好设计产品体验与组织变革方案。", "action": "推动变革时，优先考虑如何用增量代替直接剥夺既得利益。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "物理学“临界质量”与工程“断点”思维", "en": "The engineering idea of a backup system is a very powerful idea. The engineering idea of breakpoints—that's a very powerful model, too. The notion of a critical mass—that comes out of physics—is a very powerful model.", "zh": "工程学的备份系统、断点思维，以及物理学的临界质量概念，都是极其强大的底层模型。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "许多质变在到达临界质量前看似毫无动静，一旦越过阈值便呈指数爆发。", "action": "检查你正在积累的长期项目：它距离引爆口碑的“临界质量”还差哪一步？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "排列组合与基础算术的力量", "en": "You've got to be able to handle numbers and quantities—basic arithmetic. The great useful model, after compound interest, is the elementary math of permutations and combinations.", "zh": "你必须能熟练处理数字与数量——基础算术。除了复利之外，最管用的数学模型就是基础排列组合。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "在日常商业估算中，快速心算量级与组合空间就能过滤掉大部分错误方案。", "action": "用纸笔做一次 3 分钟的粗略量级估算（Fermi Estimation），不依赖他人结论。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Charlie Munger", "initials": "CM", "title": "自由市场就像生态位系统", "en": "I find it quite useful to think of a free market economy—or partly free market economy—as sort of the equivalent of an ecosystem... people who narrowly specialize can get terribly good at occupying some little niche.", "zh": "把自由市场经济看作一个生态系统非常有用——就像动物在特定生态位繁衍一样，在商业世界里高度专注细分领域的人往往能获得极佳的经济回报。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "与其在红海里跟巨头正面肉搏，不如找到一个足够深、对手不屑于做的细分生态位做到第一。", "action": "明确你的产品或个人定位里，那个最无可替代的“细分生态位”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "通过收集糟糕判断的案例来锤炼好判断", "en": "I sought good judgment mostly by collecting instances of bad judgment, then pondering ways to avoid such outcomes.", "zh": "我获得良好判断力的主要方式，就是不断收集糟糕判断的案例，然后反复琢磨如何避开那样的结局。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "反向学习法：把前人踩过的坑编成自己的雷区地图。", "action": "回顾一次你或他人做过的糟糕决策，提炼出一条今后绝不再犯的规则。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "看清“激励偏差”的隐形渗透", "en": "A natural cognitive drift toward the conclusion that what is good for the professional is good for the client and the wider civilization.", "zh": "人类有一种自然的认知漂移：总倾向于相信“对自己（或本行业）有利的事，对客户和社会也一定有利”。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "最危险的不是明目张胆的骗子，而是真心相信自己那套偏见的利益相关方。", "action": "做决策时，主动把自己从利益位置抽离出来旁观一遍。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "容忍局部小不公，换取整体大公平", "en": "Tolerating a little unfairness to some to get a greater fairness for all is a model I recommend to all of you.", "zh": "容忍对极少数人的些微不公，以换取对整体大众的更大公平——这是我向大家推荐的一个重要模型。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "试图用繁琐规则杜绝一切极小概率漏洞，往往会让整个系统僵化低效。", "action": "审视你的管理制度：是不是为了防 1% 的例外，把 99% 的正常人捆住了手脚？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "警惕成瘾与自我毁灭的渐进锁链", "en": "While susceptibility varies, addiction can happen to any of us through a subtle process where the bonds of degradation are too light to be felt until they are too strong to be broken.", "zh": "成瘾往往通过一个极其隐蔽的过程发生：起初堕落的锁链轻到你毫无察觉，等到察觉时已重到无法挣脱。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "无论是坏习惯、短期快钱还是高杠杆，都要在锁链还很轻的时候果断斩断。", "action": "识别一个正在悄悄消耗你精力的微小成瘾习惯，今天立下隔离规则。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "对坏消息保持客观，克服“巴甫洛夫联想”", "en": "If people tell you what you really don't want to hear—what's unpleasant—there's an almost automatic reaction of antipathy. You have to train yourself out of it.", "zh": "当别人告诉你你极不愿听的坏消息时，大脑几乎会自动对报信人产生反感——你必须通过后天训练克服这种本能。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "历史上无数失败的领导者，都是因为“杀死了报信的信使”而彻底耳聋眼瞎。", "action": "今天如果有同事或朋友向你提出尖锐批评，先真心说一句“谢谢你告诉我”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "不要像旅鼠一样盲目从众", "en": "The tendency of humans, under some circumstances, to resemble lemmings, explains foolish thinking of brilliant men and much foolish behavior.", "zh": "人类在特定环境下表现出的“旅鼠效应”，解释了为什么连绝顶聪明的人也会集体做出愚蠢的思考与行为。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "当所有人都在朝同一个方向狂奔时，先停下来看看前方是不是悬崖。", "action": "面对一个全行业都在追捧的热点，强迫自己冷静 24 小时再判断。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "竞争性毁灭：马车鞭子厂的宿命", "en": "When technology moves as fast as it does in a civilization like ours, you get a phenomenon that I call competitive destruction. You know, you have the finest buggy whip factory, and, all of a sudden, in comes this little horseless carriage.", "zh": "当技术飞速迭代时会出现“竞争性毁灭”：哪怕你拥有全美最优秀的马车鞭子工厂，汽车一出现，一切优势瞬间归零。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "再高的效率，如果赛道本身被新技术替代，也只是在沉船上擦拭甲板。", "action": "思考有没有某种新技术正在悄然重塑你当前依赖的核心技能或产品。"}];

    const CHECKLIST = [
      "1. 使用构建现实底层逻辑的重大理念（Use the big ideas that underlie reality）",
      "2. 真正理解事物的本质含义与隐含意义（Understand what something really means）",
      "3. 化繁为简，先解决显而易见的“无脑问题”（Simplify）",
      "4. 使用规则与过滤器（Use rules and filters）",
      "5. 明确自己具体、可衡量的目标与底线（Know what I want to achieve and avoid）",
      "6. 寻找并评估所有可行的替代方案与机会成本（Find and evaluate alternatives）",
      "7. 理解后果以及后果的长期连锁反应（Understand consequences and their consequences）",
      "8. 尽量量化关键变量与敏感度（Quantify）",
      "9. 寻找并基于客观证据与反面证据做判断（Search for and base things on evidence）",
      "10. 逆向思考：先想如何会失败，再想如何避免（Think things through backward）",
      "11. 记住巨大效应往往来自多种因素的同向合力（Big effects come from combinations of factors）",
      "12. 评估如果自己判断错了会有什么不可承受的后果（Evaluate the consequences if I'm wrong）"
    ];

    // 3-Year Range: 2026-11 to 2029-11 (37 months)
    const START_DATE = new Date(2026, 10, 1);
    const MONTHS = [];
    for (let i = 0; i < 37; i++) {
      const d = new Date(2026, 10 + i, 1);
      MONTHS.push({ year: d.getFullYear(), month: d.getMonth() + 1 });
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function fmtDate(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    const NOW = new Date();
    const TODAY_STR = (NOW >= new Date(2026, 10, 1) && NOW <= new Date(2029, 10, 30))
      ? fmtDate(NOW.getFullYear(), NOW.getMonth() + 1, NOW.getDate())
      : "2026-11-18";

    function dayIndexFromStart(dateStr) {
      const diff = Math.round((parseDate(dateStr) - START_DATE) / 86400000);
      return Math.max(0, diff);
    }

    function getQuoteForDate(dateStr) {
      const idx = dayIndexFromStart(dateStr);
      const quote = DATA[idx % DATA.length];
      const round = Math.floor(idx / DATA.length) + 1;
      return { ...quote, dayNum: idx + 1, round };
    }

    let selectedDate = localStorage.getItem("mp3_date") || TODAY_STR;
    let curYear = parseDate(selectedDate).getFullYear();
    let curMonth = parseDate(selectedDate).getMonth() + 1;
    let themeFilter = "all";
    let authorFilter = "all";
    let onlyFavs = false;
    let query = "";
    let favs = new Set(JSON.parse(localStorage.getItem("mp3_favs") || "[]"));
    let reads = new Set(JSON.parse(localStorage.getItem("mp3_reads") || `["${TODAY_STR}"]`));
    let notes = JSON.parse(localStorage.getItem("mp3_notes") || "{}");
    let checks = JSON.parse(localStorage.getItem("mp3_checks") || "{}");

    if (localStorage.getItem("mp3_ui") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }

    function save() {
      localStorage.setItem("mp3_date", selectedDate);
      localStorage.setItem("mp3_favs", JSON.stringify([...favs]));
      localStorage.setItem("mp3_reads", JSON.stringify([...reads]));
      localStorage.setItem("mp3_notes", JSON.stringify(notes));
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }

    function matches(item, dateStr) {
      if (themeFilter !== "all" && item.theme !== themeFilter) return false;
      if (authorFilter !== "all") {
        if (authorFilter === "Murphy") {
          if (!item.author.includes("Murphy") && !item.author.includes("Burke")) return false;
        } else if (!item.author.includes(authorFilter)) return false;
      }
      if (onlyFavs && !favs.has(dateStr)) return false;
      if (query.trim()) {
        const q = query.toLowerCase();
        const text = `${item.author} ${item.title} ${item.en} ${item.zh} ${item.source} ${item.insight}`.toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    }

    function initMonthSelect() {
      const sel = document.getElementById("monthSelect");
      sel.innerHTML = MONTHS.map(m => `<option value="${m.year}-${m.month}">${m.year}年 ${m.month}月</option>`).join("");
      sel.value = `${curYear}-${curMonth}`;
      sel.onchange = () => {
        const [y, m] = sel.value.split("-").map(Number);
        curYear = y; curMonth = m;
        renderGrid();
      };
    }

    function shiftMonth(delta) {
      const idx = MONTHS.findIndex(m => m.year === curYear && m.month === curMonth);
      const next = Math.min(Math.max(idx + delta, 0), MONTHS.length - 1);
      curYear = MONTHS[next].year;
      curMonth = MONTHS[next].month;
      document.getElementById("monthSelect").value = `${curYear}-${curMonth}`;
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";
      document.getElementById("monthSelect").value = `${curYear}-${curMonth}`;

      const firstDow = new Date(curYear, curMonth - 1, 1).getDay();
      const daysInMonth = new Date(curYear, curMonth, 0).getDate();

      for (let i = 0; i < firstDow; i++) {
        const empty = document.createElement("div");
        empty.className = "day-empty";
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = fmtDate(curYear, curMonth, d);
        const item = getQuoteForDate(dateStr);
        const btn = document.createElement("button");
        btn.className = "day-cell" +
          (dateStr === selectedDate ? " selected" : "") +
          (dateStr === TODAY_STR ? " today" : "") +
          (!matches(item, dateStr) ? " dimmed" : "");
        btn.onclick = () => selectDate(dateStr);

        const isRead = reads.has(dateStr);
        const isFav = favs.has(dateStr);
        const hasNote = Boolean(notes[dateStr] && notes[dateStr].trim());

        btn.innerHTML = `
          <div class="cell-top"><span>${d}</span></div>
          <div class="cell-author">${item.author.split(" ").pop()}</div>
          <div class="cell-marks">
            ${isRead ? '<span class="mark-dot mark-read" title="已读"></span>' : ''}
            ${isFav ? '<span class="mark-dot mark-fav" title="收藏"></span>' : ''}
            ${hasNote ? '<span class="mark-dot mark-note" title="有笔记"></span>' : ''}
          </div>
        `;
        grid.appendChild(btn);
      }

      document.getElementById("favCount").textContent = favs.size;
      document.getElementById("readCount").textContent = reads.size;
    }

    function renderReader() {
      const item = getQuoteForDate(selectedDate);
      const dt = parseDate(selectedDate);
      const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
      const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
      const dow = weekNames[dt.getDay()];

      const isFav = favs.has(selectedDate);
      const isRead = reads.has(selectedDate);
      const sourceHtml = item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${item.source} ↗</a>` : item.source;

      const reader = document.getElementById("reader");
      reader.innerHTML = `
        <div class="reader-header">
          <div>
            <div class="meta-badges">
              <span class="date-pill">${y}年${m}月${d}日 · 周${dow}</span>
              <span class="cycle-pill">第 ${item.dayNum} 天 · 第 ${item.round} 轮精读</span>
              <span class="theme-pill t-${item.theme}">${item.themeLabel}</span>
            </div>
            <h2 class="reader-title">${item.title}</h2>
            <div class="author-row">
              <div class="avatar">${item.initials}</div>
              <div>
                <div style="font-size: 0.9rem; font-weight: 600;">${item.author}</div>
                <div class="source-line">出处：${sourceHtml}</div>
              </div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn ${isFav ? 'active' : ''}" id="favBtn">${isFav ? '★ 已收藏' : '☆ 收藏'}</button>
            <button class="btn ${isRead ? 'active' : ''}" id="readBtn">${isRead ? '✓ 已读' : '○ 标记已读'}</button>
            <button class="btn" id="copyBtn">📋 复制原文</button>
          </div>
        </div>

        <div class="quote-stage">
          <div class="quote-watermark">”</div>
          <div class="quote-kicker">Original English Excerpt</div>
          <div class="quote-en">“${item.en}”</div>
          <div class="quote-zh">${item.zh}</div>
        </div>

        <div class="two-col">
          <div class="info-box">
            <h3>🔍 商业逻辑拆解</h3>
            <p>${item.insight}</p>
          </div>
          <div class="info-box action">
            <h3>💡 今日行动自检</h3>
            <p>${item.action}</p>
          </div>
        </div>

        <div class="note-box">
          <label for="dayNote">
            <span>✍️ 我的当日思考随笔（${selectedDate} 自动保存）</span>
            <span style="color: var(--muted); font-weight: 400;">仅保存在本机浏览器</span>
          </label>
          <textarea id="dayNote" placeholder="写下今天读完这段原文后，对你当前工作、管理或投资的一点启发…">${notes[selectedDate] || ""}</textarea>
        </div>

        <div class="reader-footer">
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" id="prevBtn">← 前一天</button>
            <button class="btn" id="todayJumpBtn">回到今日</button>
            <button class="btn" id="nextBtn">后一天 →</button>
          </div>
          <div class="kbd-hint">快捷键：<kbd>←</kbd> <kbd>→</kbd> 翻天 · <kbd>F</kbd> 收藏</div>
        </div>
      `;

      document.getElementById("favBtn").onclick = () => {
        if (favs.has(selectedDate)) favs.delete(selectedDate);
        else favs.add(selectedDate);
        save(); renderGrid(); renderReader();
      };

      document.getElementById("readBtn").onclick = () => {
        if (reads.has(selectedDate)) reads.delete(selectedDate);
        else reads.add(selectedDate);
        save(); renderGrid(); renderReader();
      };

      document.getElementById("copyBtn").onclick = () => {
        const text = `【${selectedDate} · ${item.title}】\n"${item.en}"\n—— ${item.author} (${item.source})\n\n译文：${item.zh}\n\n商业拆解：${item.insight}`;
        navigator.clipboard.writeText(text).then(() => toast("已复制中英原文与拆解"));
      };

      document.getElementById("dayNote").addEventListener("input", e => {
        notes[selectedDate] = e.target.value;
        save(); renderGrid();
      });

      document.getElementById("prevBtn").onclick = () => stepDate(-1);
      document.getElementById("nextBtn").onclick = () => stepDate(1);
      document.getElementById("todayJumpBtn").onclick = () => selectDate(TODAY_STR);
    }

    function stepDate(delta) {
      const dt = parseDate(selectedDate);
      dt.setDate(dt.getDate() + delta);
      if (dt < START_DATE || dt > new Date(2029, 10, 30)) return;
      selectDate(fmtDate(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()));
    }

    function selectDate(dateStr) {
      selectedDate = dateStr;
      const dt = parseDate(dateStr);
      curYear = dt.getFullYear();
      curMonth = dt.getMonth() + 1;
      reads.add(dateStr);
      save(); renderGrid(); renderReader();
    }

    document.getElementById("prevMonthBtn").onclick = () => shiftMonth(-1);
    document.getElementById("nextMonthBtn").onclick = () => shiftMonth(1);

    document.querySelectorAll("#themeFilters .chip").forEach(c => {
      c.onclick = () => {
        document.querySelectorAll("#themeFilters .chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        themeFilter = c.dataset.theme;
        renderGrid();
      };
    });

    document.querySelectorAll("#authorFilters .chip").forEach(c => {
      c.onclick = () => {
        document.querySelectorAll("#authorFilters .chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        authorFilter = c.dataset.author;
        renderGrid();
      };
    });

    document.getElementById("favFilterBtn").onclick = function () {
      onlyFavs = !onlyFavs;
      this.classList.toggle("active", onlyFavs);
      renderGrid();
    };

    document.getElementById("searchInput").addEventListener("input", e => {
      query = e.target.value;
      renderGrid();
    });

    document.getElementById("themeBtn").onclick = () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      localStorage.setItem("mp3_ui", dark ? "light" : "dark");
    };

    function renderChecklist() {
      const body = document.getElementById("checklistBody");
      body.innerHTML = CHECKLIST.map((t, i) => `
        <label class="check-row">
          <input type="checkbox" ${checks[i] ? "checked" : ""} data-i="${i}" />
          <span style="font-size: 0.92rem;">${t}</span>
        </label>
      `).join("");
      body.querySelectorAll("input").forEach(inp => {
        inp.onchange = () => {
          checks[inp.dataset.i] = inp.checked;
          localStorage.setItem("mp3_checks", JSON.stringify(checks));
        };
      });
    }

    document.getElementById("checklistBtn").onclick = () => {
      renderChecklist();
      document.getElementById("checklistModal").classList.add("open");
    };

    document.getElementById("closeModalBtn").onclick = () => {
      document.getElementById("checklistModal").classList.remove("open");
    };

    document.getElementById("checklistModal").onclick = e => {
      if (e.target.id === "checklistModal") e.target.classList.remove("open");
    };

    document.addEventListener("keydown", e => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowLeft") stepDate(-1);
      if (e.key === "ArrowRight") stepDate(1);
      if (e.key.toLowerCase() === "f") {
        if (favs.has(selectedDate)) favs.delete(selectedDate);
        else favs.add(selectedDate);
        save(); renderGrid(); renderReader();
      }
    });

    initMonthSelect();
    renderGrid();
    renderReader();
  </script>
</body>
</html>
