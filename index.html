<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Outsiders &amp; Munger · 2026–2029 三年每日商业智慧日历</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --bg-accent: #efeae0;
      --surface: #ffffff;
      --surface-soft: #faf8f4;
      --ink: #181714;
      --ink-2: #4a4740;
      --muted: #8a8377;
      --border: #e5dfd3;
      --border-strong: #d3cbbd;
      --gold: #9a6b16;
      --gold-bright: #b88322;
      --gold-soft: #f7efe0;
      --cap: #1d4ed8; --cap-bg: #eff6ff;
      --mgmt: #047857; --mgmt-bg: #ecfdf5;
      --model: #6d28d9; --model-bg: #f5f3ff;
      --retail: #b45309; --retail-bg: #fffbeb;
      --shadow-sm: 0 2px 10px rgba(24, 23, 20, 0.04);
      --shadow-md: 0 12px 36px rgba(24, 23, 20, 0.07);
      --radius: 18px;
      --serif: "Georgia", "Times New Roman", "Songti SC", "Noto Serif SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f1012;
      --bg-accent: #16181c;
      --surface: #181a1f;
      --surface-soft: #1f2228;
      --ink: #f0ede6;
      --ink-2: #b8b3a8;
      --muted: #7d7970;
      --border: #2a2d35;
      --border-strong: #3a3e48;
      --gold: #dfb15b;
      --gold-bright: #f0c878;
      --gold-soft: #2a2316;
      --cap: #93c5fd; --cap-bg: #172554;
      --mgmt: #6ee7b7; --mgmt-bg: #064e3b;
      --model: #c4b5fd; --model-bg: #2e1065;
      --retail: #fcd34d; --retail-bg: #451a03;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1340px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(154, 107, 22, 0.28);
    }

    .brand-text h1 { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
    .brand-text p { font-size: 0.76rem; color: var(--muted); }

    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-wrap { position: relative; }

    .search-wrap input {
      width: 220px;
      padding: 7px 14px 7px 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 0.83rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-wrap input:focus { border-color: var(--gold); width: 260px; background: var(--surface); }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--muted); pointer-events: none; }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
    .btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }
    .btn.sm { padding: 5px 10px; font-size: 0.78rem; }

    .layout {
      max-width: 1340px;
      margin: 0 auto;
      padding: 26px 28px 48px;
      display: grid;
      grid-template-columns: 455px 1fr;
      gap: 26px;
      align-items: start;
    }

    @media (max-width: 1060px) {
      .layout { grid-template-columns: 1fr; padding: 18px; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .cal-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cal-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .month-select {
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 700;
      background: var(--surface-soft);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
    }

    .month-select:focus { border-color: var(--gold); }

    .cal-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .progress-pill {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--ink-2);
      font-weight: 600;
    }

    .filters {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover { border-color: var(--gold); color: var(--gold); }
    .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 14px 4px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .cal-grid {
      padding: 6px 14px 18px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-empty { min-height: 64px; }

    .day-cell {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 7px 6px;
      min-height: 64px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      transition: all 0.16s ease;
      position: relative;
    }

    .day-cell:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .day-cell.selected { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 28%, transparent); }

    .day-cell.today::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }

    .day-cell.dimmed { opacity: 0.22; }
    .cell-top { display: flex; align-items: center; justify-content: space-between; font-size: 0.84rem; font-weight: 700; }
    .cell-author { font-size: 0.63rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .cell-marks { display: flex; gap: 3px; align-items: center; margin-top: 4px; }
    .mark-dot { width: 5px; height: 5px; border-radius: 50%; }
    .mark-read { background: #10b981; }
    .mark-fav { background: #f59e0b; }
    .mark-note { background: #3b82f6; }

    .reader { padding: 34px 38px; position: relative; }
    @media (max-width: 640px) { .reader { padding: 22px 18px; } }

    .reader-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .meta-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

    .date-pill {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid color-mix(in srgb, var(--gold) 25%, transparent);
    }

    .cycle-pill {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .theme-pill { font-size: 0.75rem; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
    .t-cap { color: var(--cap); background: var(--cap-bg); }
    .t-mgmt { color: var(--mgmt); background: var(--mgmt-bg); }
    .t-model { color: var(--model); background: var(--model-bg); }
    .t-retail { color: var(--retail); background: var(--retail-bg); }

    .author-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-accent);
      border: 1px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--gold);
    }

    .reader-title { font-family: var(--serif); font-size: 1.68rem; font-weight: 700; line-height: 1.28; letter-spacing: -0.015em; }
    .source-line { font-size: 0.82rem; color: var(--muted); }
    .source-line a { color: var(--gold); text-decoration: none; border-bottom: 1px dashed var(--gold); }
    .source-line a:hover { border-bottom-style: solid; }

    .quote-stage {
      position: relative;
      margin: 24px 0;
      padding: 28px 30px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 0 16px 16px 0;
    }

    .quote-watermark {
      position: absolute;
      top: 10px;
      right: 22px;
      font-family: var(--serif);
      font-size: 4.5rem;
      line-height: 1;
      color: var(--gold);
      opacity: 0.14;
      pointer-events: none;
      user-select: none;
    }

    .quote-kicker { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
    .quote-en { font-family: var(--serif); font-size: 1.2rem; line-height: 1.7; color: var(--ink); font-style: italic; }
    .quote-zh { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border-strong); font-size: 0.98rem; color: var(--ink-2); line-height: 1.7; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }

    .info-box { padding: 18px 20px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
    .info-box.action { background: color-mix(in srgb, var(--gold-soft) 55%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 28%, var(--border)); }
    .info-box h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .info-box p { font-size: 0.91rem; color: var(--ink-2); line-height: 1.65; }

    .note-box { margin-top: 18px; padding: 16px 18px; border-radius: 14px; border: 1px dashed var(--border-strong); background: var(--surface-soft); }
    .note-box label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
    .note-box textarea { width: 100%; min-height: 68px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 0.88rem; resize: vertical; outline: none; }
    .note-box textarea:focus { border-color: var(--gold); }

    .reader-footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .kbd-hint { font-size: 0.76rem; color: var(--muted); }
    kbd { background: var(--surface-soft); border: 1px solid var(--border-strong); border-radius: 5px; padding: 1px 6px; font-size: 0.72rem; font-family: monospace; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 60; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 740px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 28px 30px; box-shadow: var(--shadow-md); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
    .check-row { display: flex; gap: 12px; padding: 11px 8px; border-bottom: 1px dashed var(--border); align-items: flex-start; cursor: pointer; border-radius: 8px; }
    .check-row:hover { background: var(--surface-soft); }
    .check-row input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--gold); }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 0.84rem; font-weight: 500; opacity: 0; transform: translateY(8px); pointer-events: none; transition: all 0.2s ease; z-index: 80; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <h1>资本配置与普世智慧 · 三年每日原文日历</h1>
          <p>2026年11月 — 2029年11月 · 精选 186 条原典不重复循环（半年以上零重复）</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="searchInput" placeholder="搜索英文原句、人物或主题…" />
        </div>
        <button class="btn" id="favFilterBtn">★ 收藏 <span id="favCount">0</span></button>
        <button class="btn" id="checklistBtn">☑ 12条决策清单</button>
        <button class="btn" id="themeBtn">◐ 外观</button>
        <a class="btn" href="buddhism/" style="text-decoration: none;">⇄ 佛学日历</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="card">
      <div class="cal-head">
        <div class="cal-nav-row">
          <button class="btn sm" id="prevMonthBtn">← 上月</button>
          <select class="month-select" id="monthSelect"></select>
          <button class="btn sm" id="nextMonthBtn">下月 →</button>
        </div>
        <div class="cal-stats-row">
          <span>红点为今日 · 绿点已读 · 蓝点有随笔</span>
          <span class="progress-pill">累计已读 <span id="readCount">0</span> 天</span>
        </div>
      </div>

      <div class="filters">
        <div class="filter-row" id="themeFilters">
          <button class="chip active" data-theme="all">全部主题</button>
          <button class="chip" data-theme="cap">资本配置</button>
          <button class="chip" data-theme="mgmt">管理与节俭</button>
          <button class="chip" data-theme="model">思维模型</button>
          <button class="chip" data-theme="retail">护城河与零售</button>
        </div>
        <div class="filter-row" id="authorFilters">
          <button class="chip active" data-author="all">全部大师</button>
          <button class="chip" data-author="Munger">Munger</button>
          <button class="chip" data-author="Buffett">Buffett</button>
          <button class="chip" data-author="Murphy">Murphy &amp; Burke</button>
          <button class="chip" data-author="Price">Sol Price</button>
        </div>
      </div>

      <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </aside>

    <section class="card reader" id="reader"></section>
  </main>

  <div class="modal-backdrop" id="checklistModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 style="font-family: var(--serif); font-size: 1.25rem;">芒格与巴菲特 12 条决策检查清单</h2>
          <p style="font-size: 0.8rem; color: var(--muted);">出自《Seeking Wisdom》Appendix Four: Checklists</p>
        </div>
        <button class="btn" id="closeModalBtn">关闭</button>
      </div>
      <div id="checklistBody"></div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const DATA = [{"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "去中心化运营 + 高度集权的资本配置", "en": "As Charlie Munger described it to me, their companies were 'an odd blend of decentralised operations and highly centralised capital allocation,' and this mix of loose and tight, of delegation and hierarchy, proved to be a very powerful counter to the institutional imperative.", "zh": "查理·芒格曾向我这样描述：他们的公司是“去中心化运营与高度集权的资本配置的奇特结合”，这种松紧相济、授权与层级并存的模式，被证明是对抗“机构惯性”的极其强大的武器。", "source": "William N. Thorndike《The Outsiders》", "url": "https://harry-cheslaw.medium.com/the-outsiders-f2cfb8de678a", "insight": "顶级商业领袖把日常决策权下放给一线，但把自由现金流的配置权牢牢握在总部。", "action": "审视你的工作：哪些日常执行可放手授权，哪些核心资源需集中配置？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Tom Murphy", "initials": "TM", "title": "去中心化是管理哲学的基石", "en": "Decentralization is the cornerstone of our management philosophy. Our goal is to hire the best people we can find and give them the responsibility and authority they need to perform their jobs. Decisions are made at the local level, consistent with the basic responsibilities of corporate management…", "zh": "去中心化是我们管理哲学的基石。我们的目标是雇佣我们能找到的最优秀的人才，并赋予他们履行职责所需的责任和权力。决策在基层做出，同时符合公司管理的基本职责……", "source": "Capital Cities/ABC Annual Report", "url": "https://www.deciphr.ai/podcast/328-tom-murphy-buffetts-favorite-manager", "insight": "Tom Murphy 收购 ABC 时总部仅 36 人，用极高的人才标准换取极低的官僚监督成本。", "action": "检查你最近亲自介入的一件琐事，试着明确边界后交给靠谱的伙伴。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Dan Burke", "initials": "DB", "title": "年度“小黑屋”问责制", "en": "We sit everybody down in the dark once a year and show them what they said they were going to do for the year and what they actually did. Then we look at what they say they're going to do next year. It's sort of compelling to know that a year from now you're going to be back in that same slot.", "zh": "我们每年让所有人坐在暗处一次，向他们展示年初说要做什么以及实际做了什么，再看明年打算做什么。知道一年后还会回到同一位置接受检视，这本身就有强大的约束力。", "source": "25iq: Tom Murphy", "url": "https://25iq.com/2015/01/11/a-dozen-things-ive-learned-from-tom-murphy-about-capital-allocation-and-management/", "insight": "高度授权必须搭配刚性问责，只对比承诺与实际交付，不留废话空间。", "action": "翻出你上季度立下的核心目标，用最客观的数据对照实际完成度。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "警惕“机构惯性”（Institutional Imperative）", "en": "My most surprising discovery: the overwhelming importance in business of an unseen force that we might call 'the institutional imperative.' In business school, I was given no hint of the imperative's existence and I did not intuitively understand it when I entered the business world. Instead, rationality frequently wilts when the institutional imperative comes into play.", "zh": "我最惊讶的发现是商业中存在一种看不见的力量——“机构惯性”。当机构惯性发挥作用时，理性往往会迅速枯萎。", "source": "Berkshire Hathaway 1989 Annual Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "人总是倾向于模仿同行，哪怕做法在财务上很愚蠢，因为合群能掩盖无能。", "action": "问自己：如果没人看见我的决定，仅凭事实与回报率，我还会这样选吗？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Tom Murphy", "initials": "TM", "title": "不要雇了狗，却自己去吠叫", "en": "[Warren Buffett and I] are both proponents of a decentralized management philosophy: of hiring key people carefully; of pushing decisions down the organization; and of setting overall principles and resisting temptation to be involved with details. In other words, don't hire a dog and try to do the barking.", "zh": "巴菲特和我都推崇去中心化管理：精挑细选关键人才，把决策权下放，设定原则并克制插手细节的冲动。换句话说，不要雇了一只狗，却自己去吠叫。", "source": "25iq / Tom Murphy", "url": "https://25iq.com/2015/01/11/a-dozen-things-ive-learned-from-tom-murphy-about-capital-allocation-and-management/", "insight": "微管理消耗领导者带宽，并摧毁下属的责任感。", "action": "今天克制一次“我来直接做”的冲动，把判断标准抛回给负责人。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Dan Burke", "initials": "DB", "title": "最佳搭档的分工：创造现金 vs 配置现金", "en": "My job was to create the free cash flow and Murphy's was to spend it.", "zh": "我的工作是创造自由现金流，而墨菲的工作是把它花掉（进行资本配置）。", "source": "Dan Burke, Capital Cities/ABC", "url": "https://www.eosworldwide.com/blog/the-greatest-two-person-combination-the-world-has-ever-seen", "insight": "运营赚来的钱，若配置不当同样会毁于一旦；创造与配置缺一不可。", "action": "区分手头工作：哪些在提升当前现金流，哪些在配置长期复利？"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "零售的“六项正确”（The Six Rights）", "en": "You've got to have the right kind, in the right place, at the right time, in the right quantity, in the right condition, at the right price.", "zh": "你必须在正确的地点、正确的时间，以正确的数量、正确的状态和正确的价格，提供正确种类的商品。", "source": "Robert Price《Sol Price》", "url": "https://blas.com/sol-price/", "insight": "零售的本质不是花哨营销，而是对供应链与商品力的极致精准。", "action": "用“六项正确”检视你负责的核心产品或服务，找出当前短板。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "把一切效率省下的钱还给顾客", "en": "We sell items for as little as we can, instead of for as much as we can. We always pass on any savings or reduction in cost to the member.", "zh": "我们尽可能以最低的价格出售商品，而不是尽可能卖高价。我们总是把任何节省下来的成本回馈给会员。", "source": "Costco Orientation", "url": "https://www.costco.com/wcsstore/CostcoUSBCCatalogAssetStore/Attachment/Orientation_Magazine_2018.pdf", "insight": "“顾客受托人”心态会形成对手根本不敢模仿的规模飞轮。", "action": "思考有没有一种成本优化可以直接让利给用户，换取更高复购？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "逆向思考：反过来想，总是反过来想", "en": "Think forwards and backwards — invert, always invert. Many hard problems are best solved when they are addressed backward.", "zh": "正反两面思考——反过来想，总是反过来想。许多棘手的问题，从反面入手反而最容易解决。", "source": "25iq / Charlie Munger", "url": "https://25iq.com/2015/09/12/a-dozen-things-ive-learned-from-charlie-munger-about-inversion-including-the-importance-of-being-consistently-not-stupid-2/", "insight": "与其空想如何大获成功，不如先列清哪些愚蠢行为会导致失败并坚决避开。", "action": "写下本周最重要事情会彻底搞砸的3个原因，并立即设置防范底线。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "长期保持“不愚蠢”的复利优势", "en": "It is remarkable how much long-term advantage [we] have gotten by trying to be consistently not stupid, instead of trying to be very intelligent.", "zh": "令人惊叹的是，我们仅仅通过努力“持续保持不愚蠢”，而不是试图“显得非常聪明”，就获得了巨大的长期优势。", "source": "25iq / Charlie Munger", "url": "https://25iq.com/2015/09/12/a-dozen-things-ive-learned-from-charlie-munger-about-inversion-including-the-importance-of-being-consistently-not-stupid-2/", "insight": "在复利的世界里，不犯致命错误比偶尔灵光一现重要得多。", "action": "做复杂判断前，先检查自己是否在遵循最朴素的常识。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "跨过一英尺的栏杆，而非七英尺", "en": "After 25 years of buying and supervising a great variety of businesses, Charlie and I have not learned how to solve difficult business problems. What we have learned is to avoid them. To the extent we have been successful, it is because we concentrated on identifying one-foot hurdles that we could step over rather than because we acquired any ability to clear seven-footers.", "zh": "25年后，查理和我依然没学会解决棘手的商业难题，我们学会的是避开它们——专注于寻找一英尺高的跨栏，而非跨越七英尺高栏。", "source": "Berkshire Hathaway 1989 Annual Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "商业没有难度系数加分，选简单高确定性赛道比在泥潭里炫技更划算。", "action": "盘点待办事项：有没有哪个高难度低回报的“七英尺栏杆”可以直接放弃？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "时间是好生意的朋友，平庸生意的敌人", "en": "Time is the friend of the wonderful business, the enemy of the mediocre.", "zh": "时间是优秀企业的朋友，却是平庸企业的敌人。", "source": "Berkshire Hathaway 1989 Annual Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "护城河不够深的生意，时间越久越被竞争侵蚀；好资产才配得上长期持有。", "action": "评估你投入最多时间的项目：三年后时间会让它的壁垒更深还是更脆？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Tom Murphy", "initials": "TM", "title": "把成本意识刻进公司 DNA", "en": "Cost control was the baseline of our company culture. We worked to make cost-consciousness a part of our company's DNA. Budgets, which are set yearly and reviewed quarterly, originate with the operating units that are responsible for them.", "zh": "成本控制是我们公司文化的底线。我们努力让成本意识成为公司 DNA 的一部分。预算按年制定、按季审查，由基层运营单元发起。", "source": "25iq: Tom Murphy", "url": "https://25iq.com/2015/01/11/a-dozen-things-ive-learned-from-tom-murphy-about-capital-allocation-and-management/", "insight": "节俭不是抠门，而是把每一块钱留在真正产生高回报的地方。", "action": "检查一笔你最近习惯性的开销：它真的能带来匹配的产出吗？"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "绝不占供应商便宜的商业诚信", "en": "One time we were selling ladies' hosiery for $3.99 and Sol got the idea we should sell the package for $2.99 and so he said we would give up 50 cents if the supplier would also give up 50 cents... After about six months it had not really moved a needle in selling the hosiery so Sol asked Ira to go back to the supplier and give them back the 50 cents.", "zh": "有一次降价未见起色，索尔让买手回去把供应商之前配合让利的 50 美分退还给对方。", "source": "《Sol Price》p. 84", "url": "https://blas.com/sol-price/", "insight": "公平对待上游供应商，才能换取长期最好的货源与底价。", "action": "对长期合作伙伴展现一次超出预期的公平与诚信。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "警惕杠杆：聪明人破产的唯一原因", "en": "Whenever a really bright person who has a lot of money goes broke, it's because of leverage ... It's almost impossible to go broke without borrowed money being in the equation.", "zh": "每当一个非常聪明、又很有钱的人破产时，原因几乎都是杠杆……如果没有借钱，你几乎不可能破产。", "source": "《Seeking Wisdom》p. 157", "url": "", "insight": "高波动叠加高杠杆，一次尾部事件就能清零前面所有的复利。", "action": "评估财务或业务结构：有没有隐性杠杆需要提前降噪？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Henry Singleton", "initials": "HS", "title": "CEO 的两项核心职责：运营与配置", "en": "CEOs need to do two things well to be successful: run their operations efficiently and deploy the cash generated by those operations. Most CEOs focus on managing operations, which is undeniably important. Singleton, in contrast, gave most of his attention to the later task.", "zh": "CEO 要想成功必须做好高效运营与配置现金两件事。大多数人只盯着运营，而辛格尔顿把精力放在配置现金上。", "source": "William N. Thorndike《The Outsiders》", "url": "https://harry-cheslaw.medium.com/the-outsiders-f2cfb8de678a", "insight": "在股价低估时果断回购超 90% 股份，是每股价值增长的终极杠杆。", "action": "思考额外利润或自由时间，除了投入老业务还能去哪？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "自催化效应（Autocatalysis）与复用复利", "en": "Disney is an amazing example of autocatalysis ... They had all those movies in the can. They owned the copyright. And just as Coke could prosper when refrigeration came, when the videocassette was invented, Disney didn't have to invent anything or do anything except take the thing out of the can and stick it on the cassette.", "zh": "迪士尼是自催化效应的绝佳案例：他们拥有片库版权，录像带发明时只需把老电影灌进去就能再次变现。", "source": "《Seeking Wisdom》", "url": "", "insight": "一次建设、多次变现的版权与强品牌具备强大的自催化复利。", "action": "盘点手头内容、数据或版权资产，思考能否零边际成本二次复用。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "手拿锤子的人，看什么都像钉子", "en": "If you don't have the full repertoire, I guarantee you that you'll overutilize the limited repertoire you have - including use of models that are inappropriate just because they're available to you in the limited stock you have in mind.", "zh": "如果你没有完整的思维模型库，你一定会过度使用手里仅有的那几个模型，哪怕它们根本不适用。", "source": "《Seeking Wisdom》", "url": "", "insight": "建立跨学科的多元思维格栅，才能避免盲人摸象。", "action": "遇到今天难题时，试着换一个完全不同的学科视角来重审。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "一生只需要做对几次重大决策", "en": "Charlie and I decided long ago that in an investment lifetime, it's just too hard to make hundreds of smart decisions... Therefore, we adopted a strategy that required our being smart - and not too smart at that - only a very few times.", "zh": "在一生的投资生涯中，想做对几百个明智决定太难了，因此我们只要求自己做对非常少数的几次决定。", "source": "《Seeking Wisdom》p. 212", "url": "", "insight": "高频决策拉低胜率，把子弹留给极少数赔率极高的时刻。", "action": "回顾过去一年真正决定结果的 1-2 个大选择是什么？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "好骑手也骑不赢一匹老弱病马", "en": "Good jockeys will do well on good horses, but not on broken-down nags.", "zh": "优秀的骑手骑上好马能大显身手，但骑在老弱病马上却无能为力。", "source": "Berkshire Hathaway 1989 Annual Letter", "url": "https://acquirersmultiple.com/2017/10/warren-buffett-mistakes-of-the-first-twenty-five-years/", "insight": "商业模式的结构性优劣，远比个人努力更决定上限。", "action": "诚实评估当前赛道是一匹“好马”还是靠苦撑的“老马”。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "头版头条测试（The Front-Page Test）", "en": "Would I be willing to see my action immediately described by an informed and critical reporter on the front page of my local paper, there to be read by my spouse, children and friends?", "zh": "我是否愿意看到自己即将采取的行动，立刻被挑剔的记者写进当地报纸头版，让配偶、孩子和朋友看到？", "source": "《Seeking Wisdom》", "url": "", "insight": "合法并不代表正确，“头版头条测试”是最锋利的道德罗盘。", "action": "遇到略感犹豫的灰色决策时，先用头版头条测试过滤一遍。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "少做预测，就能提高预测准确率", "en": "Around here I would say that if our predictions have been a little better than other people's, it's because we've tried to make fewer of them.", "zh": "如果说我们的预测比别人稍微准一点，那是因为我们尽量少做预测。", "source": "《Seeking Wisdom》", "url": "", "insight": "承认“我不知道”，只对少数长期规律下判断，反而赢得高胜率。", "action": "面对无法把握的短期宏观噪音，坦然练习说“不在能力圈内”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "用常识解决大问题", "en": "I think if you get the big points with organized common sense, it's amazing the placer mining you never have to do ...", "zh": "如果你能用有条理的常识抓住大方向，你会惊讶地发现自己根本不需要做繁琐的沙里淘金工作。", "source": "《Seeking Wisdom》", "url": "", "insight": "需要极复杂模型才勉强算得过账的生意，通常本身不够好。", "action": "试着用 3 句大白话讲清你正在纠结方案的核心逻辑。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "伊索寓言里的终极估值公式", "en": "Aesop's investment axiom, thus expanded and converted into dollars, is immutable. It applies to outlays for farms, oil royalties, bonds, stocks, lottery tickets, and manufacturing plants. And neither the advent of the steam engine, the harnessing of electricity nor the creation of the automobile changed the formula one iota - nor will the Internet.", "zh": "伊索寓言的投资公理换算成美元后永恒不变。蒸汽机、电力、汽车乃至互联网都未能改变这个公式分毫。", "source": "Berkshire Hathaway 2000 Annual Report", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "一切资产的价值永远取决于未来自由现金流的折现。", "action": "看新概念时抛开叙事，先算算未来 5-10 年能流回多少现金。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "John Burr Williams", "initials": "JW", "title": "留存收益必须创造复利", "en": "If earnings not paid out in dividends are all successfully reinvested at compound interest for the benefit of the stockholder ... then these earnings should produce dividends later; if not, then they are money lost.", "zh": "未派发的利润若能以复利成功再投资，日后理应产生更高回报；否则就等于白白亏损。", "source": "《The Theory of Investment Value》", "url": "", "insight": "留存每一块钱都有机会成本，投不好就该回购或分红。", "action": "检视留存资金或时间，低回报部分应果断抽回。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Tom Murphy", "initials": "TM", "title": "把精力花在你能控制的事情上", "en": "Don't spend your time on things you can't control. Instead, spend your time thinking about what you can.", "zh": "不要把时间浪费在你无法控制的事情上，而要把时间花在思考你能控制的事情上。", "source": "25iq: Tom Murphy", "url": "https://25iq.com/2015/01/11/a-dozen-things-ive-learned-from-tom-murphy-about-capital-allocation-and-management/", "insight": "宏观与市场情绪不可控，成本、品质与人才密度完全由你掌控。", "action": "划掉今天清单里让你焦虑却无能为力的外部变量。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "外行人的视角能打破行业陈规", "en": "Fortunately most of us had backgrounds that were alien to retailing.", "zh": "幸运的是，我们大多数人的背景都与传统零售业毫无关系。", "source": "《Sol Price》", "url": "https://blas.com/sol-price/", "insight": "不受传统高毛利教条束缚，才敢用仓库+会员制重构零售成本。", "action": "找出你所在行业里一条“大家习以为常”的潜规则来质疑。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Sol Price", "initials": "SP", "title": "商业排序：顾客第一，员工第二，股东第三", "en": "Our first duty is to our customers.", "zh": "我们的首要职责是对顾客负责（顾客第一，员工第二，股东第三）。", "source": "《Sol Price》", "url": "https://blas.com/sol-price/", "insight": "让渡短期毛利给顾客和员工，最终转化为股东的惊人长期回报。", "action": "检查近期决策是否因短期报表而牺牲了用户长期体验。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "向“杰出的已故之人”学习", "en": "Also, there is no reason to look only for living models. The eminent dead are in the nature of things some of the best models around.", "zh": "没有理由只向活着的人学习，杰出的已故先贤是你所能找到的最好的榜样。", "source": "《Seeking Wisdom》", "url": "", "insight": "通过经典传记以极低成本吸收数百年沉淀下来的最高智慧。", "action": "选一位敬佩的先贤，今晚读一章他的传记或原始信件。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "最快的毁灭之道：变得不可靠", "en": "First, be unreliable. Do not faithfully do what you have engaged to do. If you will only master this one habit you will more than counterbalance the combined effect of all your virtues, howsoever great.", "zh": "首先，变得不可靠，不忠实履行承诺。这一个坏习惯足以抵消你所有美德的总和。", "source": "《Seeking Wisdom》", "url": "", "insight": "信任是商业社会里成本最低、壁垒最高的货币。", "action": "检查答应过别人的一件小事，今天之内保质保量闭环。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "每天比醒来时更聪明一点", "en": "Spend each day trying to be a little wiser than you were when you woke up. Discharge your duties faithfully and well.", "zh": "每天都努力比早上醒来时更聪明一点，忠实而出色地履行自己的职责。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "智慧不是一蹴而就的顿悟，而是日拱一卒的微小增量叠加。", "action": "睡前花 2 分钟写下今天新学到的一个底层规律。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "应对人生艰难的三件法宝", "en": "Life and its various passages can be hard, brutally hard. The three things I have found helpful in coping with its challenges are: Have low expectations. Have a sense of humor. Surround yourself with the love of friends and family.", "zh": "人生的各个阶段有时会非常残酷。我发现应对挑战的三件法宝是：降低预期、保持幽默感、让自己被亲友的爱包围。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "低预期带来高幸福感与强抗压性，幽默感则是情绪的缓冲垫。", "action": "对今天最让你焦虑的一件事，主动把心理预期调低一档。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "强烈兴趣是卓越的前提", "en": "Intense interest in any subject is indispensable if you're really going to excel in it. I could force myself to be fairly good in a lot of things, but I couldn't excel in anything in which I didn't have an intense interest.", "zh": "要在任何领域真正出类拔萃，对它的强烈兴趣不可或缺。我可以强迫自己把很多事做得不错，但无法在没有浓厚兴趣的领域做到顶尖。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "自律只能带你到中上水平，唯有发自内心的好奇才能支撑长期复利。", "action": "观察自己最近哪件事即使没人催也忍不住想琢磨。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "追问“为什么”的习惯", "en": "You need to have a passionate interest in why things are happening. That cast of mind, kept over long periods, gradually improves your ability to focus on reality. If you don't have that cast of mind, you're destined for failure even if you have a high I.Q.", "zh": "你必须对事情“为什么会发生”抱有极大的热情。长期保持这种思维习惯会提升你聚焦现实的能力；否则即使智商再高也注定失败。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "智商只是硬件，追问因果、直面现实的习惯才是操作系统。", "action": "对今天遇到的一个意外结果，连问三次“为什么”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "获取智慧是一种道德责任", "en": "The acquisition of wisdom is a moral duty. It's not something you do just to advance in life. And there's a corollary to that idea that is very important. It requires that you're hooked on lifetime learning.", "zh": "获取智慧是一种道德责任，而不仅仅是为了在世俗中出人头地。它的重要推论是：你必须对终身学习上瘾。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "无知不仅伤害自己，在关键岗位上还会连累信任你的同事、股东与家人。", "action": "把今天的阅读时间当成一项不可妥协的日常责任。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "不需要绝顶聪明，只需长期略胜一筹", "en": "You don't have to be brilliant, only a little bit wiser than the other guys, on average, for a long, long time.", "zh": "你不需要绝顶聪明，只需要在很长很长的时间里，平均而言比别人聪明那么一点点就够了。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "微小优势乘以几十年的时间长度，会产生令人震撼的复利差距。", "action": "放弃追求一战封神的捷径，专注于每天比昨天稳健一点。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "所有聪明人都大量阅读", "en": "In my whole life, I have known no wise people (over a broad subject matter area) who didn't read all the time—none, zero.", "zh": "在我漫长的一生中，我从未见过哪个在广泛领域有真知灼见的人不是终日手不释卷的——一个也没有，零。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "阅读是人类以最低成本获取他人几十年浓缩经验的唯一途径。", "action": "今晚睡前放下手机 20 分钟，读几页真正有密度的书。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "成为一台“学习机器”", "en": "I constantly see people rise in life who are not the smartest, sometimes not even the most diligent. But they are learning machines. They go to bed every night a little wiser than they were that morning.", "zh": "我不断看到有些人在生活中脱颖而出，他们既不是最聪明的，有时甚至不是最勤奋的，但他们是“学习机器”——每天晚上睡觉时都比早上醒来时更有智慧。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "持续迭代的斜率，最终决定了人生所能到达的高度。", "action": "复盘今天的一个失误或新见闻，提炼成一条可复用的经验。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "学会“如何学习”的方法", "en": "Just as civilization can progress only when it invents the method of invention, you can progress only when you learn the method of learning.", "zh": "正如人类文明只有发明了“发明的方法”才能突飞猛进，个人也只有掌握了“学习的方法”才能真正进步。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "孤立记忆碎片很快会遗忘，用思维模型框架串联知识才能事半功倍。", "action": "把今天新学的一个概念，挂靠到你已知的某个旧模型上。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "掌握前人总结出的最好成果", "en": "I believe in the discipline of mastering the best that other people have ever figured out. I don't believe in just sitting down and trying to dream it all up yourself. Nobody's that smart.", "zh": "我信奉掌握前人已经摸索出的最佳成果这一纪律。我不相信光靠自己坐着冥思苦想就能发明一切，没人聪明到那种地步。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "站在巨人肩膀上做整合，远比闭门造车高效得多。", "action": "遇到难题前，先查查历史上最聪明的人是怎么解决同类问题的。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "用别人的惨痛教训代替自己交学费", "en": "The more hard lessons you can learn vicariously rather than through your own hard experience, the better.", "zh": "你能通过他人间接吸取的惨痛教训越多，而不是亲自去撞南墙，就越好。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "收集失败案例，比收集成功鸡汤更能保护你的本金与时间。", "action": "研究一个同行或历史企业的失败案例，找出它踩中的核心陷阱。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "历史书里藏着数十亿美元的答案", "en": "There is no better teacher than history in determining the future … There are answers worth billions of dollars in a $30 history book.", "zh": "在判断未来方面，没有比历史更好的老师……一本 30 美元的历史书里，藏着价值数十亿美元的答案。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "技术外壳日新月异，但人性、贪婪、恐惧与周期规律几千年从未改变。", "action": "遇到当下的狂热或恐慌时，回想一下历史上的类似剧本是如何收场的。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "沉重的意识形态会扭曲认知", "en": "Heavy ideology is one of the most extreme distorters of human cognition … If you get a lot of heavy ideology young—and then you start expressing it—you are really locking your brain into a very unfortunate pattern.", "zh": "沉重的意识形态是人类认知最极端的扭曲器之一。如果你年纪轻轻就陷入某种强烈教条并反复表达，你就会把大脑锁死在糟糕的模式里。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "一旦立场先行，大脑就会自动过滤所有不支持自己观点的客观事实。", "action": "检查自己是否对某个行业、公司或人群抱有未经检验的刻板成见。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "芒格的“铁律处方”", "en": "I feel that I'm not entitled to have an opinion unless I can state the arguments against my position better than the people who are in opposition. I think that I am qualified to speak only when I've reached that state.", "zh": "我觉得，除非我能比反对者更透彻地陈述反对我自己的论据，否则我没有资格发表意见。只有达到那种境界，我才算有资格开口。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "最高级的理性是主动替对手写出最强有力的反驳稿。", "action": "针对你目前最坚信的一个判断，试着写出 3 条最有力度的反方理由。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "现实问题不会按学科边界乖乖排队", "en": "I could already see that real-world problems didn't neatly lie within territorial boundaries. They jumped right across. And I was dubious of any approach that, when two things were inextricably intertwined and interconnected, would try and think about one thing but not the other.", "zh": "现实世界的问题不会乖乖待在单一学科的边界里，它们总是跨界交织。若两件事密不可分，只研究其一而忽略另一方是极度可疑的。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "商业决策往往同时涉及经济、心理、法律与工程，切忌单维归因。", "action": "分析今天的一个问题时，至少列出心理因素与财务因素各两条。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "正视不喜欢但真实存在的现实", "en": "One should recognize reality even when one doesn't like it, indeed, especially when one doesn't like it. Also, I think one should cheerfully endure paradox that one can't remove by good thinking.", "zh": "一个人应该承认现实，哪怕他并不喜欢这个现实——恰恰在最不喜欢的时候，越要承认。同时，对无法消除的悖论要保持豁达。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "逃避坏消息不会让它消失，只会让止损的窗口期白白溜走。", "action": "直面一件你最近一直拖着不愿看的数据或现实问题。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "简单的两步黄金法则", "en": "There is an old two-part rule that often works wonders in business, science, and elsewhere: (1) Take a simple, basic idea and (2) take it very seriously.", "zh": "有一条古老的两步法则在商业、科学和各领域都屡试不爽：（1）找一个简单、基础的好主意；（2）极其认真地去执行它。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "伟大往往不在于主意有多复杂，而在于把最朴素的真理执行到极致。", "action": "选一条你早已知道却一直没认真执行的原则，今天彻底落实一次。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "死记孤立事实毫无用处", "en": "What is elementary, worldly wisdom? Well, the first rule is that you can't really know anything if you just remember isolated facts and try and bang 'em back. If the facts don't hang together on a latticework of theory, you don't have them in a useable form.", "zh": "第一条规则是：如果你只是死记硬背孤立的事实，你根本不算懂任何东西。如果事实不能挂靠在理论框架的格栅上，就无法为你所用。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "信息过载时代，缺的不是零散资讯，而是能把资讯串联起来的底层框架。", "action": "整理一条你最近的笔记，问自己它背后的底层规律是什么。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "约 90 个重要模型就够了", "en": "Fortunately, it isn't that tough—because eighty or ninety important models will carry about ninety percent of the freight in making you a worldly-wise person. And, of those, only a mere handful really carry very heavy freight.", "zh": "幸运的是，这并不难——八九十个重要模型就能承担起让你具备普世智慧 90% 的重任，而其中真正起到决定性作用的不过寥寥数个。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "二八定律同样适用于知识结构，先把最核心的十几个大模型练到条件反射。", "action": "列出你目前最常使用的 3 个思维模型，看看今天能否用上它们。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "用检查清单弥补大脑记忆漏洞", "en": "You've got to use those tools checklist-style because you'll miss a lot if you just hope that the right tool is going to pop up unaided whenever you need it.", "zh": "你必须像查清单一样逐项核对这些思维工具；如果只指望需要时大脑能自动灵光一现，你一定会漏掉很多关键点。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "飞行员起飞前必查清单，投资与重大决策同样需要外部防错机制。", "action": "做下一个重要决定前，打开本应用右上角的“12条决策清单”逐条核对。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "硬科学与工程学的可靠性最高", "en": "The models that come from hard science and engineering are the most reliable models on this Earth.", "zh": "来自硬科学和工程学的模型，是地球上最可靠的模型。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "冗余备份、安全边际、临界质量等工程概念，在商业风控中极其管用。", "action": "检查你的关键业务流程或财务安排，有没有设置“备份系统（Backup）”？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "不会基础概率就像独腿上擂台", "en": "If you don't get this elementary, but mildly unnatural, mathematics of elementary probability into your repertoire, then you go through a long life like a one-legged man in an ass-kicking contest.", "zh": "如果你不能把基础概率论（费马-帕斯卡体系）纳入自己的思维武器库，那你漫长的人生就像独腿汉参加踢屁股比赛一样吃亏。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "人类大脑天生不擅长直觉计算概率与期望值，必须靠书面算术纠偏。", "action": "用“成功概率 × 潜在收益 - 失败概率 × 潜在损失”评估一次手头选择。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "会计只是生意的粗略近似", "en": "You have to know enough about (accounting) to understand its limitations—because although accounting is the starting place, it's only a crude approximation.", "zh": "你必须足够了解会计，才能看清它的局限性——虽然会计是分析的起点，但它只是商业现实的粗略近似。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "会计利润不等于自由现金流，研发、品牌和人才往往不在资产负债表上。", "action": "看财报或经营报表时，多问一句：哪些真实价值或隐性成本没被算进去？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "分辨技术是帮你还是毁了你", "en": "The great lesson in microeconomics is to discriminate between when technology is going to help you and when it's going to kill you.", "zh": "微观经济学最伟大的一课，就是分辨新技术究竟是在帮你的忙，还是准备把你彻底淘汰。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "许多行业升级技术后，省下的成本全被竞争对手逼着让利给了顾客，资本回报率不升反降。", "action": "思考你所在行业的新技术（如 AI）：它最终会拓宽你的护城河，还是让行业变成更惨烈的红海？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "双轨分析法：理性利益 + 潜意识误判", "en": "I now use a kind of two-track analysis. First, what are the factors that really govern the interests involved, rationally considered? And second, what are the subconscious influences where the brain at a subconscious level is automatically forming conclusions in various ways?", "zh": "我现在采用双轨分析法：第一轨，理性考量真正决定各方利益的因素；第二轨，审视大脑在潜意识层面自动形成结论的心理偏误。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "既算清经济账，又算清人心账，才能看透复杂博弈的真实走向。", "action": "分析一次合作或谈判时，分别写下对方的“明面利益”和“潜意识顾虑”。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "Lollapalooza 综合放大效应", "en": "When several models combine, you get lollapalooza effects; this is when two, three, or four forces are all operating in the same direction. And, frequently, you don't get simple addition. It's often like a critical mass in physics where you get a nuclear explosion.", "zh": "当两三种或四五种力量朝同一个方向共同作用时，你得到的不是简单相加，而是像物理学临界质量那样爆发式的 Lollapalooza 效应。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "真正改变格局的大事件或超级牛股，往往是多种正向因子共振的结果。", "action": "寻找你的主力项目中，哪 2-3 个驱动力可以设计成互相强化的同向飞轮？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "守住你的能力圈边界", "en": "You have to figure out where you've got an edge. And you've got to play within your own circle of competence … In effect, you've got to know what you know and what you don't know. What could possibly be more useful in life than that?", "zh": "你必须搞清楚自己的优势在哪里，并且只在自己的能力圈内出手……归根结底，你要知道自己知道什么、不知道什么，世上还有比这更有用的事吗？", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "能力圈的大小不重要，重要的是你是否诚实地知道边界在哪里。", "action": "今天面对一个陌生领域的诱惑，坦然把它放进“太难/不懂”的篮子里。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "理解复利的力量与获取之难", "en": "Understanding both the power of compound interest and the difficulty of getting it is the heart and soul of understanding a lot of things.", "zh": "同时理解复利的巨大威力以及获取它的艰难程度，是理解世间诸多事物的核心与灵魂。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "复利最怕中途断档和大幅回撤，稳健可持续比短期爆发更重要。", "action": "保护好你长期积累的复利曲线，避免因一次冲动冒进而重头再来。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "机会成本是一切正确决策的超级武器", "en": "Opportunity cost is a superpower, to be used by all people who have any hope of getting the right answer.", "zh": "机会成本是一种超能力，任何希望得出正确答案的人都必须善用它。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "不要问“这件事值不值得做”，而要问“比起我手头最好的次优选择，它值不值得做”。", "action": "把你今天要投入时间的新任务，和你手头回报最高的事对比一下。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "冲浪模型：趁早抓住大浪潮", "en": "When these new businesses come in, there are huge advantages for the early birds. And when you're an early bird, there's a model that I call 'surfing'—when a surfer gets up and catches the wave and just stays there, he can go a long, long time.", "zh": "当新产业浪潮来临时，早起者拥有巨大优势。我称之为“冲浪模型”——只要冲浪者站起来抓住了浪头并稳住身位，就能滑行很远很远。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "当真正的结构性大浪潮出现时，选对浪头比单纯卖力划水重要十倍。", "action": "思考你所处的领域中，当前哪一股长周期技术或消费浪潮最值得稳稳站上去？"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Charlie Munger", "initials": "CM", "title": "大公司病：规模越大，官僚越重", "en": "The great defect of scale, of course, which makes the game interesting—so that the big people don't always win—is that as you get big, you get the bureaucracy. And with the bureaucracy comes the territoriality—which is again grounded in human nature.", "zh": "规模带来的巨大缺陷（也是游戏之所以有趣、大象不总能赢的原因）在于：一旦变大就会滋生官僚主义，随之而来的便是山头主义。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "规模是把双刃剑，一旦效率优势被官僚内耗抵消，巨头就会被灵活的新锐颠覆。", "action": "检查你的团队沟通里，最近有没有因为流程变多而产生推诿或山头？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "要改变行为，诉诸利益而非说教", "en": "Appeal to interest and not to reason if you want to change conclusions … Perverse incentives are so powerful as controllers of human cognition and human behavior that one should avoid their influence.", "zh": "如果你想改变别人的结论，请诉诸利益而非空讲道理……扭曲的激励机制对人类认知与行为的掌控力极其可怕，务必远离。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "永远先看激励机制，再听对方嘴上怎么承诺。", "action": "检视你当前的激励或考核方案，它是在奖励正确的行为，还是在诱发短视？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "一定要告诉别人“为什么”", "en": "If you always tell people why, they'll understand it better, they'll consider it more important, and they'll be more likely to comply. Even if they don't understand your reason, they'll be more likely to comply.", "zh": "如果你总是告诉别人“为什么”，他们会理解得更深、更加重视，也更愿意配合——哪怕他们一时还没完全听懂你的理由。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "布置任务时多花 30 秒讲清背后的原因，能成倍提升执行质量。", "action": "今天给同事或伙伴安排工作时，顺带讲清楚这件事的底层原因。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "最难骗也最容易骗的人是你自己", "en": "The best defense is that of the best physicists, who systematically criticize themselves to an extreme degree, using a mindset described by Nobel laureate Richard Feynman as follows: 'The first principle is that you must not fool yourself, and you're the easiest person to fool.'", "zh": "最好的防御是像顶尖物理学家那样极端地自我审视——牢记费曼的第一原则：绝不要欺骗自己，而你自己恰恰是最容易被骗的人。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "人总是在不知不觉中为自己的错误决策找借口，自我批判才是最高自律。", "action": "挑一个你很满意的决定，像挑刺的审计师一样审视一遍它的漏洞。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "主动寻找推翻自己观点的证据", "en": "Darwin paid special attention to disconfirming evidence, particularly when it disconfirmed something he believed and loved. Routines like that are required if a life is to maximize correct thinking … If you can get really good at destroying your own wrong ideas, that is a great gift.", "zh": "达尔文特别留意反面证据，尤其是能推翻他最珍视观点的证据。如果你能练就亲手摧毁自己错误想法的本领，那将是莫大的天赋。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "大脑天生喜欢搜集佐证（确认偏误），唯有刻意搜寻反证才能接近真相。", "action": "花 5 分钟搜集一条与你当前核心观点相反的数据或事实。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Charlie Munger", "initials": "CM", "title": "想得到什么，先让自己配得上它", "en": "The safest way to try to get what you want is to try to deserve what you want. It's such a simple idea. It's the golden rule. You want to deliver to the world what you would buy if you were on the other end.", "zh": "想要得到某样东西，最稳妥的办法就是让自己配得上它。这是黄金法则：如果你站在交易的另一端，你会愿意买自己提供的东西吗？", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "长期来看，产品力、专业度与人品都会精确匹配到你应得的回报。", "action": "站在客户或合作方的角度审视你的交付物：如果我是对方，我会满意吗？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "分辨“普朗克知识”与“司机知识”", "en": "In this world I think we have two kinds of knowledge: One is Planck knowledge, that of the people who really know. They've paid the dues, they have the aptitude. Then we've got chauffeur knowledge. They have learned to prattle the talk.", "zh": "世上有两种知识：一种是普朗克式的真知，属于真正下过苦功的人；另一种是“司机知识”，只是背熟了漂亮话术、嗓门洪亮却不懂底层逻辑。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "永远不要被光鲜的 PPT 和流利的术语唬住，多问两层底层细节就会原形毕露。", "action": "检视自己正在谈论的某个热门概念：我是真懂原理，还是在复述“司机知识”？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "推演二阶与三阶后果", "en": "Consequences have consequences, and the consequences of the consequences have consequences, and so on.", "zh": "后果还会产生新的后果，而新后果又会继续引发连锁反应，层层递进。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "平庸决策只看眼前的第一层反馈，高手的目光落在第二、第三层博弈之后。", "action": "为今天的一个决定多往后推演一步：“如果对手/市场这样反应，接下来会怎样？”"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "远离嫉妒、怨恨与自怜", "en": "Generally speaking, envy, resentment, revenge and self-pity are disastrous modes of thought. Self-pity can get pretty close to paranoia. And paranoia is one of the very hardest things to reverse.", "zh": "嫉妒、怨恨、报复和自怜都是灾难性的思维模式。自怜距离偏执狂只有一步之遥，而偏执是最难逆转的心态。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "负面情绪既不创造任何价值，还会严重消耗理性的决策带宽。", "action": "觉察到自己开始抱怨或比较时，立刻把注意力拉回可控的行动上。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Charlie Munger", "initials": "CM", "title": "对抗通胀的最好方式：减少愚蠢消费", "en": "Most people will see declining returns (due to inflation). One of the great defenses if you're worried about inflation is not to have a lot of silly needs in your life—you don't need a lot of material goods.", "zh": "如果你担心通胀侵蚀回报，最好的防御之一就是不要在生活里制造太多愚蠢的物质欲望——你其实并不需要那么多东西。", "source": "Poor Charlie's Almanack", "url": "https://www.sloww.co/poor-charlies-almanack/", "insight": "欲望越少，财务自由的门槛就越低，做决策时的从容度就越高。", "action": "检查本周的一次消费冲动，区分它是“真实需要”还是“虚荣对比”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "用合理价格买伟大公司，而非捡烟蒂", "en": "The investment game always involves considering both quality and price, and the trick is to get more quality than you pay for in price. It's just that simple.", "zh": "投资这场游戏永远要同时权衡品质与价格，诀窍在于你获得的企业品质要高于你付出的价格——就这么简单。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "芒格把巴菲特从单纯的“便宜货猎手”升级为“优质复利资产的长期持有者”。", "action": "评估手头资产时，多花 50% 的精力研究商业品质本身，而非只盯着静态估值倍数。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "经营实业是最好的投资课堂", "en": "It's one thing to own stock in a Coca-Cola or something, but when you're actually in the business of making determinations about opening stores and pricing decisions, you learn from it. We have made a lot more money out of See's than shows from the earnings of See's, just by the fact that it's educated me.", "zh": "买可口可乐股票是一回事，但当你真正参与开店选址和定价决策时，你学到的东西完全不同。我们从喜诗糖果赚到的钱，远不止账面利润，更重要的是它教育了我。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "懂企业经营的人更能看懂股票，懂资本配置的人更能管好企业。", "action": "从具体一线经营者的视角，重新复盘一家你关注的公司。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "评估生意的唯一核心：定价权", "en": "The single most important decision in evaluating a business is pricing power. If you've got the power to raise prices without losing business to a competitor, you've got a very good business. And if you have to have a prayer session before raising the price by 10 percent, then you've got a terrible business.", "zh": "评估一家企业最重要的单一标准就是定价权。如果你能提价而不流失客户，你拥有一门好生意；如果涨价 10% 前还要祈祷，那就是一门糟糕的生意。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "真正的护城河最终都会体现在“顾客心甘情愿为你的品牌溢价买单”上。", "action": "思考你自己的产品或服务：如果明天提价 10%，客户会走多少？为什么？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "梦幻生意：不需额外投入资本却能持续增长", "en": "The ideal business is one that takes no capital, and yet grows. And there are a few businesses like that, and we own some.", "zh": "最理想的生意，是不需要投入额外资本却能持续增长的生意。世上有少数这样的生意，而我们拥有其中几家。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "轻资产、高周转、强现金流的企业，能把每年赚来的几乎全部利润都送回总部去买新资产。", "action": "对比两个生意时，优先看“每多赚 1 块钱利润，需要多压多少营运资本或设备”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "两种利润率同样12%的截然不同生意", "en": "There are two kinds of businesses: The first earns 12%, and you can take it out at the end of the year. The second earns 12%, but all the excess cash must be reinvested — there's never any cash. It reminds me of the guy who looks at all of his equipment and says, 'There's all of my profit.' We hate that kind of business.", "zh": "世界上有两种回报率同为 12% 的生意：第一种年底你可以把现金全拿走；第二种你必须把所有现金继续投回机器设备里，手里永远没现钱。我们痛恨第二种生意。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "账面利润不等于可自由支配的现金，重资产吞金兽往往是价值陷阱。", "action": "检查你关注的业务：它的利润最后变成了账上的现金，还是变成了折旧的设备？"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Warren Buffett", "initials": "WB", "title": "买进大宗商品，卖出强势品牌", "en": "Buy commodities, sell brands has long been a formula for business success. It has produced enormous and sustained profits for Coca-Cola since 1886 and Wrigley since 1891.", "zh": "买进大宗商品原料，卖出强势消费品牌，长久以来都是商业成功的黄金公式。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "原料成本随行就市，但终端品牌心智却能锁住高毛利与用户忠诚度。", "action": "你的业务是在卖同质化的“大宗商品”，还是卖有情感溢价的“品牌”？"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Charlie Munger", "initials": "CM", "title": "品牌的信息优势与社会认同效应", "en": "The informational advantage of brands is hard to beat. And your advantage of scale can be an informational advantage... Everyone is influenced by what others do and approve.", "zh": "品牌带来的信息优势很难被击败。规模优势本身就是一种信息优势——每个人都会受他人购买与认可的影响。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "消费者买知名品牌，本质上是在为“确定性”和“省去试错成本”付费。", "action": "思考如何让你的老客户自然成为新客户的信任背书。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Charlie Munger", "initials": "CM", "title": "关于管理咨询报告的辛辣观察", "en": "I have never seen a management consultant's report in my long life that didn't end with the following paragraph: 'What this situation really needs is more management consulting.' Never once.", "zh": "我这辈子从未见过哪份管理咨询报告最后一段不是这样写的：“这种情况真正需要的是更多的管理咨询。”从来没有例外。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "注意激励偏差：靠建议收费的人，永远有动机把简单问题复杂化。", "action": "听取外部顾问或机构建议时，先审视对方的收费模式与利益立场。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Charlie Munger", "initials": "CM", "title": "拥抱波动的优质生意，胜过平稳的平庸生意", "en": "Some great businesses have very volatile returns – for example, See's usually loses money in two quarters of each year – and some terrible businesses can have steady results.", "zh": "有些伟大的生意回报具有很强的季节性波动——比如喜诗糖果每年有两个季度都亏损——而有些糟糕的生意业绩看起来却很平稳。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "不要把“季度波动”误当成“风险”，市场嫌弃波动时往往就是好买点。", "action": "分辨一项资产的波动是“季节性正常起伏”还是“底层逻辑恶化”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "好行业顺风 vs 糟糕行业逆风", "en": "If you have to choose one, bet on the business momentum, not the brilliance of the manager. But, very rarely, you find a manager who's so good that you're wise to follow him into what looks like a mediocre business.", "zh": "如果只能二选一，押注商业模式本身的势能，而不是押注管理者的个人光环。", "source": "25iq: See's Candies", "url": "https://25iq.com/2016/11/25/a-dozen-things-warren-buffett-and-charlie-munger-learned-from-sees-candies/", "insight": "逆水行舟再努力也事倍功半，选对自带顺风的商业结构才是根本。", "action": "检查你的主力投入：它是在顺风局放大努力，还是在逆风局苦苦支撑？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "用净资产收益率（ROE）而非每股收益衡量管理层", "en": "We believe a more appropriate measure of managerial economic performance to be return on equity capital.", "zh": "我们认为，衡量管理层经济表现更恰当的尺子是净资产收益率（ROE），而不是每股收益的绝对增长。", "source": "Berkshire Hathaway 1977 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "哪怕把钱存进银行吃利息，留存收益逐年累加也会推高每股收益，唯有 ROE 才能检验资本使用效率。", "action": "评估任何项目或公司时，先看它投入资本的回报率，而非只看营收规模增长。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "选择顺风行业的重要性", "en": "One of the lessons your management has learned - and, unfortunately, sometimes re-learned - is the importance of being in businesses where tailwinds prevail rather than headwinds.", "zh": "管理层学到的最重要一课是：置身于顺风吹拂的行业，远胜于逆风而行。", "source": "Berkshire Hathaway 1977 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "顺风行业里即使犯些小错也能取得不错结果，逆风行业里拼尽全力也只是勉强维持。", "action": "分辨你当前业务面对的是行业顺风还是结构性逆风。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "像收购整家公司一样选股票", "en": "We select our marketable equity securities in much the same way we would evaluate a business for acquisition in its entirety. We want the business to be (1) one that we can understand, (2) with favorable long-term prospects, (3) operated by honest and competent people, and (4) available at a very attractive price.", "zh": "我们挑选公开市场股票的标准，与评估整体收购一家企业完全一致：看得懂、长期前景好、由诚实能干的人经营、价格极具吸引力。", "source": "Berkshire Hathaway 1977 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "股票不是跳动的筹码，而是对应一家真实企业的部分所有权。", "action": "用这四条标准重新审视你目前关注的一家公司。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "欢迎好公司股价下跌", "en": "In fact, if their business experience continues to satisfy us, we welcome lower market prices of stocks we own as an opportunity to acquire even more of a good thing at a better price.", "zh": "只要企业本身的经营依然令我们满意，我们反而欢迎所持股的市价下跌，因为这让我们有机会以更划算的价格买到更多好资产。", "source": "Berkshire Hathaway 1977 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "如果你是长期净买入者，跌价是在给你打折，而不是在让你亏钱。", "action": "下次市场情绪悲观时，先检查基本面是否恶化，再决定是否趁打折加码。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "低周转率 + 低利润率 = 资本回报灾难", "en": "Slow capital turnover, coupled with low profit margins on sales, inevitably produces inadequate returns on capital.", "zh": "缓慢的资本周转率加上微薄的销售利润率，必然导致惨淡的资本回报率。", "source": "Berkshire Hathaway 1978 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "杜邦分析的核心：要么靠高周转（如 Costco），要么靠高利润率（如软件/奢侈品），两者皆无就是苦生意。", "action": "算一算你所在业务的利润率与资金周转天数，看看提升空间在哪一端。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "高成本运营者与低成本运营者的惯性差异", "en": "Our experience has been that the manager of an already high-cost operation frequently is uncommonly resourceful in finding new ways to add to overhead, while the manager of a tightly-run operation usually continues to find additional methods to curtail costs, even when his costs are already well below those of his competitors.", "zh": "高成本企业的管理者总能想出新办法增加开支；而精打细算的管理者哪怕成本已远低于同行，依然会不断寻找进一步降本的方法。", "source": "Berkshire Hathaway 1978 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "节俭与浪费都是会自我强化的组织文化习惯。", "action": "向团队里最节俭的部门学习一条可复制的控费做法。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "困境反转股很少真的反转", "en": "Both our operating and investment experience cause us to conclude that 'turnarounds' seldom turn, and that the same energies and talent are much better employed in a good business purchased at a fair price than in a poor business purchased at a bargain price.", "zh": "我们的经验表明，“困境反转”很少真的反转；把精力用在以合理价格买好生意上，远胜于以低价买烂生意。", "source": "Berkshire Hathaway 1979 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "救活一家深陷泥潭的企业所耗费的心力，足够再造两家好公司。", "action": "检查手头正在“硬救”的低效项目，思考是否该果断止损。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "宁愿留出冗余，也不盲目接亏损单", "en": "We would rather have some slack in the organization from time to time than keep everyone terribly busy writing business on which we are going to lose money.", "zh": "我们宁愿让组织偶尔保持一点空闲余地，也不愿让大家忙得团团转却是在做注定亏钱的业务。", "source": "Berkshire Hathaway 1979 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "没有利润率的虚假忙碌，是在加速消耗组织的现金与士气。", "action": "删掉一项“看起来很忙、实际上几乎不赚钱”的常规动作。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "极度精简总部的威力", "en": "Your company is run on the principle of centralization of financial decisions at the top (the very top, it might be added), and rather extreme delegation of operating authority to a number of key managers at the individual company or business unit level.", "zh": "公司的运作原则是：最高层高度集中财务与资本决策，同时将运营权力极其充分地授予各业务单元的关键管理者。", "source": "Berkshire Hathaway 1979 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "精简总部能省下巨额层级内耗，并吸引那些渴望像老板一样独立干事的顶级人才。", "action": "检查汇报链条，看看有哪些审批其实可以一步直达一线。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "留存收益的价值取决于使用效率", "en": "The value of those retained earnings is determined by the use to which they are put and the subsequent level of earnings produced by that usage. (It's the act that counts, not the actors.)", "zh": "留存收益的价值取决于它被投入到什么地方以及随之产生的盈利水平——重要的是配置行为本身，而不是由谁来操作。", "source": "Berkshire Hathaway 1980 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "哪怕只持有优秀企业 1% 的股权，只要管理层善于复利再投资，你的隐形财富就在不断滚雪球。", "action": "关注一家公司时，追踪它过去 5 年留存利润的再投资回报率。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "短期市场预测毫无用处", "en": "We believe that short-term forecasts of stock or bond prices are useless. The forecasts may tell you a great deal about the forecaster; they tell you nothing about the future.", "zh": "短期预测股债价格毫无用处。这些预测只能暴露预测者自己的心思，对未来却毫无揭示。", "source": "Berkshire Hathaway 1980 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "与其把时间浪费在听宏观预测上，不如多研究具体企业的基本面。", "action": "今天关掉一条情绪化的短期市场预测推送。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "充沛流动性是危机时的弹药库", "en": "The most attractive opportunities may present themselves at a time when credit is extremely expensive - or even unavailable. At such a time we want to have plenty of financial firepower.", "zh": "最具吸引力的机会往往出现在信贷极度昂贵甚至枯竭的时刻。在那样的时刻，我们希望手里握有充足的财务火力。", "source": "Berkshire Hathaway 1980 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "平时看似低效的现金储备，其实是危机时刻低价扫货的看涨期权。", "action": "确保你的个人或业务账上保留足够应对突发机会与风险的现金缓冲。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "宁买优秀企业的10%，不买平庸企业的100%", "en": "Regardless of the impact upon immediately reportable earnings, we would rather buy 10% of Wonderful Business T at X per share than 100% of T at 2X per share.", "zh": "无论对当期报表利润有何影响，我们宁愿以 X 的价格买入优秀企业 10% 的股权，也不愿以 2X 的溢价收购它的 100%。", "source": "Berkshire Hathaway 1981 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "控制权虚荣往往是高溢价并购毁灭股东价值的根源。", "action": "做合作或投资时，问自己是否为了“控制欲”而支付了不划算的溢价。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "抗通胀好生意的两大特征", "en": "Such favored business must have two characteristics: (1) an ability to increase prices rather easily... without fear of significant loss of either market share or unit volume, and (2) an ability to accommodate large dollar volume increases in business... with only minor additional investment of capital.", "zh": "能抵御通胀的优质企业必须具备两个特征：轻松提价而不丢份额，以及用很少的额外资本投入就能承接名义营收增长。", "source": "Berkshire Hathaway 1981 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "轻资产 + 强定价权，是穿越高通胀周期的终极护城河。", "action": "用这两个标准检验你最看好的消费或科技商业模式。"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "事实不会因为被忽略而停止存在", "en": "Facts do not cease to exist, either because they are unpleasant or because they are ignored.", "zh": "事实不会因为令人不快，或者因为被刻意忽略，就停止存在。", "source": "Berkshire Hathaway 1981 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "越是刺耳的经营数据，越需要第一时间摆在桌面上解决。", "action": "正视今天一个你原本想绕过去的真实问题。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "切勿用被低估的股份去换取高估资产", "en": "Our share issuances follow a simple basic rule: we will not issue shares unless we receive as much intrinsic business value as we give. Why, you might ask, would anyone issue dollar bills in exchange for fifty-cent pieces?", "zh": "我们发行新股遵循一条简单规则：除非得到的内在商业价值至少等于付出的价值，否则绝不增发。谁会傻到拿 1 美元钞票去换 50 美分硬币呢？", "source": "Berkshire Hathaway 1982 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "在交易中，你付出的对价和得到的资产同样重要。", "action": "做任何资源置换前，先算清楚自己“付出的真实机会成本”。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "把简单之事做到极致", "en": "Jack Byrne and Bill Snyder are achieving the most elusive of human goals - keeping things simple and remembering what you set out to do.", "zh": "杰克·伯恩和比尔·斯奈德实现了人类最难达成的目标——保持事情简单，并牢记最初出发的目标。", "source": "Berkshire Hathaway 1982 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "复杂往往意味着失焦，高手总能把庞杂业务收束到一两句核心原则。", "action": "用一句话重申你今年最核心的初衷，看看自己有没有偏航。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "与股东同甘共苦的合伙人精神", "en": "Although our form is corporate, our attitude is partnership. Charlie Munger and I think of our shareholders as owner-partners, and of ourselves as managing partners... We eat our own cooking.", "zh": "虽然形式上是股份公司，但我们的态度是合伙人制。查理和我把股东视作所有者合伙人，我们自己也把绝大部分身家放在同一口锅里吃饭。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "利益高度绑定（Skin in the Game）是比任何监管条文都更可靠的治理机制。", "action": "检查你发起的项目中，自己是否承担了与合作方对称的风险与收益。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "用每股内在价值而非总规模衡量成败", "en": "We do not measure the economic significance or performance of Berkshire by its size; we measure by per-share progress.", "zh": "我们不用公司体量大小来衡量伯克希尔的成败，而是用每股内在价值的增长速度来衡量。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "盲目做大营收很容易，但真正提升单位投入产出比才考验真本事。", "action": "把你的考核视角从“总量增长”切换到“人均/单位资本回报”。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Warren Buffett", "initials": "WB", "title": "用“我想不想跟它竞争”检验护城河", "en": "One question I always ask myself in appraising a business is how I would like, assuming I had ample capital and skilled personnel, to compete with it. I'd rather wrestle grizzlies than compete with Mrs. B and her progeny.", "zh": "评估一家企业时我总会自问：假如我有充足的资金和顶尖团队，我愿不愿意跟它正面竞争？我宁愿和灰熊摔跤，也不愿跟 B 夫人竞争。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "如果给你 100 亿美元也无法撼动对方的用户心智或成本优势，那它就是极深护城河。", "action": "用“假如我有无限资金怎么打败它”来压力测试你的护城河。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "账面价值 vs 内在价值", "en": "Book value tells you what has been put in; intrinsic business value estimates what can be taken out.", "zh": "账面价值告诉你过去往里投入了多少钱；内在价值估算的是未来还能从中拿出多少钱。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "沉没成本与历史投入都不重要，未来现金流产出才是全部意义。", "action": "放弃对历史沉没成本的执念，只看未来能产出什么。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "价格是你付出的，价值是你得到的", "en": "In candy, as in stocks, price and value can differ; price is what you give, value is what you get.", "zh": "糖果和股票一样，价格和价值截然不同；价格是你付出的东西，价值是你得到的东西。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "便宜买烂货依然很贵，合理价格买高价值资产反而极度便宜。", "action": "买任何重要服务或资产时，先评估它的长期真实价值而非只比价。"}, {"theme": "mgmt", "themeLabel": "管理与节俭", "author": "Warren Buffett", "initials": "WB", "title": "你传递什么信号，就会吸引什么人", "en": "Self selection will draw a far different crowd to a musical event advertised as an opera than one advertised as a rock concert even though anyone can buy a ticket to either.", "zh": "把演出宣传为歌剧还是摇滚音乐会，会吸引来截然不同的人群——尽管任何人都可以买票。", "source": "Berkshire Hathaway 1983 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "你的价值观、沟通方式和游戏规则，决定了你会吸引长期同路人还是短线投机客。", "action": "审视你对外传达的合作原则，看看它在吸引哪类伙伴。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "有时“按兵不动”是最难的智慧", "en": "We try to avoid compromise of these standards, although we find doing nothing the most difficult task of all. (One English statesman attributed his country's greatness in the nineteenth century to a policy of 'masterly inactivity'.)", "zh": "我们绝不降低标准，尽管“什么都不做”其实是最难完成的任务（大师级的无为而治）。", "source": "Berkshire Hathaway 1984 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "在没有好球可打时扛住球棒不动，是顶级选手与平庸选手的分水岭。", "action": "今天如果找不到把握足够大的机会，就安心等待，不为了显得勤奋而瞎忙。"}, {"theme": "retail", "themeLabel": "护城河与零售", "author": "Rose Blumkin (Mrs. B)", "initials": "RB", "title": "B夫人的极简商业秘诀", "en": "Mrs. B boils it down to 'sell cheap and tell the truth'.", "zh": "B夫人把全部商业秘诀浓缩成六个字：“卖得便宜，讲真话。”", "source": "Berkshire Hathaway 1984 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "极致性价比加上绝对透明诚信，在任何时代都是最难被击败的零售基石。", "action": "在今天的客户沟通中，做到极致坦诚、绝不夸大。"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "每留存 1 美元，至少创造 1 美元市值", "en": "Unrestricted earnings should be retained only when there is a reasonable prospect... that for every dollar retained by the corporation, at least one dollar of market value will be created for owners.", "zh": "只有当留存的每一美元都有望为股东创造至少一美元的市场价值时，企业才应该留存收益。", "source": "Berkshire Hathaway 1984 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "这是检验管理层资本配置能力的黄金 1 美元测试。", "action": "检查一笔再投资预算：它能否创造超过投入本金的长期价值？"}, {"theme": "cap", "themeLabel": "资本配置", "author": "Warren Buffett", "initials": "WB", "title": "决定战绩的是你上了哪条船，而不是划得多用力", "en": "A good managerial record (measured by economic returns) is far more a function of what business boat you get into than it is of how effectively you row.", "zh": "优异的管理战绩，更多取决于你登上了哪一艘商业之船，而不是你划桨有多用力。", "source": "Berkshire Hathaway 1985 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "如果船本身在漏水，再怎么拼命舀水也不如换一条坚固的新船。", "action": "评估你正在全力投入的方向：这条“船”本身的行业经济学健康吗？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "理智应该是心灵的仆人，而非奴隶", "en": "I ignored Comte's advice - 'the intellect should be the servant of the heart, but not its slave'.", "zh": "我忽略了孔德的忠告——“理智应当是心灵的仆人，但绝不能沦为它的奴隶。”", "source": "Berkshire Hathaway 1985 Letter", "url": "https://blas.com/berkshire-annual-shareholder-letters-by-warren-buffett/", "insight": "当情感依恋凌驾于理性算术之上时，往往会让你在亏损业务里越陷越深。", "action": "检查有没有因为感情或面子而迟迟不愿做出的理性止损？"}, {"theme": "model", "themeLabel": "思维模型", "author": "Warren Buffett", "initials": "WB", "title": "从别人的错误中学习成本最低", "en": "The trick is
