name: kindle-daily

on:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer deps
        run: |
          npm install --prefix kindle
          ./kindle/node_modules/.bin/playwright install --with-deps chromium

      - name: Render daily cards
        run: node kindle/render.mjs

      - name: Commit images back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kindle/out
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(kindle): daily card $(date -u +%F)"
            git push
          fi
