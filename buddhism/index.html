heme": "mindful", "themeLabel": "生死觉知与AI时代", "author": "《AI时代佛教弘化》论文", "initials": "慧", "title": "MaRIS 教学：把闻思修融入数字学习", "quote": "将听闻、思辨与静心实践结合，避免数字化学习沦为浅层信息消费。", "zh": "数字时代最大的陷阱是“收藏即学会”；唯有经过自己的反复思辨（思）和在生活中的刻意练习（修），信息才会沉淀为智慧。", "source": "《人工智慧（AI）時代下佛教弘化變革、機遇與應對初探》", "url": "https://religion.tcu.edu.tw/wp-content/uploads/2025/10/%E3%80%90%E6%9C%83%E5%BE%8C%E4%BF%AE%E8%A8%82%E3%80%914-A1_%E9%87%8B%E8%80%80%E7%B7%A3%E9%87%8B%E8%81%96%E5%9B%A0_%E4%BA%BA%E5%B7%A5%E6%99%BA%E6%85%A7%EF%BC%88AI%EF%BC%89%E6%99%82%E4%BB%A3%E4%B8%8B%E4%BD%9B%E6%95%99%E5%BC%98%E5%8C%96%E8%AE%8A%E9%9D%A9%E3%80%81%E6%A9%9F%E9%81%87%E8%88%87%E6%87%89%E5%B0%8D%E5%88%9D%E6%8E%A2.pdf", "insight": "收藏夹里躺着一百篇文章，不如今天在日历笔记里写下两句真实心得。", "action": "读完今天这页日历后，在下方笔记栏写下 1 句你自己的真实感悟。"}, {"theme": "mindful", "themeLabel": "生死觉知与AI时代", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "佛教与现代教育的对话", "quote": "现代教育培养了大量职业技能，却很少教人如何面对痛苦与情绪。", "zh": "宗萨仁波切在探讨现代佛教教育时指出，真正的教育不仅要教孩子如何谋生，更要教他们理解无常、培养同理心与管理自心。", "source": "《现代教育与佛教的未来》专访", "url": "https://www.buddhistdoor.net/features/modern-education-and-the-future-of-buddhism-an-interview-with-dzongsar-khyentse-rinpoche/", "insight": "无论年龄多大，学习“如何与自己的情绪相处”都是终身必修课。", "action": "今天遇到焦躁时，不急着压制或发泄，像观察一位老朋友一样观察它的来去。"}, {"theme": "mindful", "themeLabel": "生死觉知与AI时代", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "结缚与解缚：松解生命的绳结", "quote": "整条宏伟的修行之道，都包含在‘松解缠结’这个简单表述中。", "zh": "我们用各种身份、计划、期待和爱恨把自己绑成死结，这就是轮回；而修道不是再打一个更漂亮的结，而是一根一根把绳结温柔地松开。", "source": "《2014 缘起相依（纽约）》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "少一点“我必须如何”，多一点“允许它自然发生”，绳结就会慢慢松动。", "action": "检查今天日程中让你感到紧绷的一件事，看看能不能主动降一点期待、松一口气。"}, {"theme": "mindful", "themeLabel": "生死觉知与AI时代", "author": "《AI时代佛教弘化》论文", "initials": "慧", "title": "正念钟声：在忙碌中按暂停键", "quote": "数字工具也可以成为唤醒正念的钟声，提醒我们回到呼吸。", "zh": "就像寺院里定时响起的钟声能让僧众停下脚步收摄身心，我们也可以利用手机提醒或呼吸间隙，在高效运转中守住内心的清明。", "source": "《人工智慧（AI）時代下佛教弘化變革、機遇與應對初探》", "url": "https://religion.tcu.edu.tw/wp-content/uploads/2025/10/%E3%80%90%E6%9C%83%E5%BE%8C%E4%BF%AE%E8%A8%82%E3%80%914-A1_%E9%87%8B%E8%80%80%E7%B7%A3%E9%87%8B%E8%81%96%E5%9B%A0_%E4%BA%BA%E5%B7%A5%E6%99%BA%E6%85%A7%EF%BC%88AI%EF%BC%89%E6%99%82%E4%BB%A3%E4%B8%8B%E4%BD%9B%E6%95%99%E5%BC%98%E5%8C%96%E8%AE%8A%E9%9D%A9%E3%80%81%E6%A9%9F%E9%81%87%E8%88%87%E6%87%89%E5%B0%8D%E5%88%9D%E6%8E%A2.pdf", "insight": "工具本身无善恶，能让你慢下来看清自己的工具，就是好工具。", "action": "利用今天每次喝水的机会，先停顿三秒感受水流过喉咙，再继续工作。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "佛教徒的“叛逆”：不信永恒", "quote": "若你认为有某样和合事物是永恒不变的，那便偏离了第一法印。", "zh": "四法印具有极强的解构力量：它不断提醒我们，健康、关系、名望乃至灵性体验都是暂时组合的，因此不必拼命抓紧。", "source": "《近乎佛教徒》", "url": "https://khyentsefoundation.org/chs/resource/book_movie/what-makes-you-not-a-buddhist/", "insight": "越想把美好的东西冻结成永恒，失去时的裂痕就越深。", "action": "今天享受一段好时光时，纯粹地投入当下，而不去担心它什么时候结束。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "印顺法师 · 印慈法师", "initials": "印", "title": "无常的微观真相：刹那生灭", "quote": "外在看似静止之物，内在组成成分的运动变化一刻也未曾停止。", "zh": "现代物理学印证了佛陀的洞察：看似坚固的桌椅与身体，在微观层面正以每秒亿万次的频率生灭迁流，没有一刻静止。", "source": "《成佛之道全集讲义》", "url": "https://gemini.google.com/notebook/c335fe0f-2968-47c6-80ad-289bc8b17eb7", "insight": "连“现在的我”也与一分钟前的我截然不同，不必背着昨天的包袱走今天。", "action": "原谅昨天那个不够完美的自己，以全新的状态迎接今天。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "《法句经》", "initials": "法", "title": "如实观照：如牧牛人护心", "quote": "心难调伏，轻躁随欲转；善调伏心者，是则引安乐。", "zh": "未经训练的心就像不受约束的野马，总在贪爱与厌恶间乱窜；温和而坚定地把心带回正念，是世间最大的安乐之源。", "source": "《法句经》心品", "url": "https://84000.co/zh-tw", "insight": "不是压抑念头，而是像牧牛人一样温柔地看着牛群，不让它们踩坏庄稼。", "action": "发现自己分心走神时，不自责，笑着把注意力拉回手头的事。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "正法与相似法：看本质而非包装", "quote": "真正重要的不是外在有多神圣，而是它能否削弱你的我执。", "zh": "如果某种修行让你变得越来越挑剔别人、越来越觉得自己高人一等，那多半是“自我”在借佛法壮大自己。", "source": "《近乎佛教徒》", "url": "https://khyentsefoundation.org/chs/resource/book_movie/what-makes-you-not-a-buddhist/", "insight": "检验一切修行的黄金标准只有一个：我执是不是变薄了，心是不是更柔软了？", "action": "今天练习放下一件你平时很执着的“我是对的”的坚持。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "《成佛之道》", "initials": "佛", "title": "正法四胜：善、净、常、安乐", "quote": "正法妙难思，善净常安乐，依古仙人道，能入于涅槃。", "zh": "世俗快乐短暂且夹杂忧虑，唯有依循古今觉者共同走过的八正道，才能尝到清净、稳定且不伤害任何众生的安乐。", "source": "《成佛之道全集讲义》", "url": "https://gemini.google.com/notebook/c335fe0f-2968-47c6-80ad-289bc8b17eb7", "insight": "真正的喜悦不需要以别人的失落或环境的消耗为代价。", "action": "今天寻找一件纯粹、安静、不伤害任何生命的快乐小事（如散步、听雨或阅读）。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "不制造新的参照点", "quote": "我们对身份、成就和评价的依赖，正是不断制造焦虑的参照点。", "zh": "自我感之所以存在，是因为我们不断通过比较、赞美或受害者叙事来确认“我是谁”；当参照点松动时，焦虑便无处附着。", "source": "《活着即是迈向死亡》", "url": "https://khyentsefoundation.org/chs/resource/book_movie/living-is-dying-how-to-prepare-for-death-dying-and-beyond/", "insight": "少一次拿自己和别人比较，就多十分内心的清净空间。", "action": "今天刷到他人的高光时刻时，只送上祝福，不拿来当反衬自己焦虑的尺子。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "《阿含经》", "initials": "阿", "title": "不染着六根：见色闻声止于当下", "quote": "于见止于见，于闻止于闻，于觉止于觉。", "zh": "眼睛看到画面、耳朵听到声音时，若能停留在纯然的感知，不立刻添油加醋编织“我喜欢/我讨厌”的故事，心就不会被外境牵走。", "source": "《杂阿含经》", "url": "https://84000.co/zh-tw", "insight": "事实往往只有一分，情绪故事却占了九分；把感知和解读分开，烦恼立减。", "action": "今天听到一句刺耳的话时，先把它当成纯物理的声波，停顿三秒再回应。"}, {"theme": "seals", "themeLabel": "四法印与正见", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "别把“开悟”当成战利品", "quote": "试图把空性或解脱抓进自己口袋里，本身就是最隐蔽的贪婪。", "zh": "我们习惯了凡事都要“有所得”；但佛法恰恰是一场“减法”——不是给你增加一个神圣头衔，而是帮你卸下沉重的幻觉包袱。", "source": "《人间是剧场》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "当你不再急于向自己证明“我进步了”，真正的轻安反而会悄悄到来。", "action": "今天放下对“效率”或“自我提升”的焦虑，允许自己单纯地存在二十分钟。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "月称菩萨", "initials": "月", "title": "破四边生：不自生，不他生", "quote": "非自非他非共生，亦非无因随处生，故知诸法本无生。", "zh": "《入中论》开宗明义破斥“自生、他生、共生、无因生”四种执着：事物既不是自己生出自己，也不是由一个绝对他者创造，而是无自性的缘起显现。", "source": "《入中论讲记》", "url": "https://gemini.google.com/notebook/c335fe0f-2968-47c6-80ad-289bc8b17eb7", "insight": "理解“无生”，不是否定因果显现，而是看清没有任何事物能孤立诞生。", "action": "观察你今天取得的一个小成果，感谢背后促成它的所有团队与环境因缘。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "无我不是“自我被消灭了”", "quote": "无我并非把一个原本存在的自我杀掉，而是发现它本来就不存在。", "zh": "就像夜里把绳子误看成蛇而吓得半死；开灯看清它本来就是绳子时，并没有一条“蛇”被杀死了，只是错觉消失了。", "source": "《佛教的见地与修道》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "修行不是和自己打仗，而是开灯看清房间里根本没有鬼怪。", "action": "停止与自己的坏情绪硬碰硬对抗，试着用好奇的灯光去照亮它。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "《心经》", "initials": "心", "title": "以无所得故，心无挂碍", "quote": "以无所得故，菩提萨埵，依般若波罗蜜多故，心无挂碍。", "zh": "挂碍与恐惧，总是来自“怕失去已经得到的”和“怕得不到想要的”；唯有深悟万法无所得，心才能彻底远离颠倒梦想。", "source": "《般若波罗蜜多心经》", "url": "https://84000.co/zh-tw", "insight": "“无所得”不是消极躺平，而是全力以赴之后对得失的坦然。", "action": "今天完成一件重要任务后，练习在心里说一句：“尽心了，结果随缘。”"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "空性就是“一切皆有可能”", "quote": "正因现象没有固有的限制，才同时拥有无限转化的空间。", "zh": "如果一个人的性格或一段困境是铁板一块的“实有”，那永远不会有转机；正因为一切皆空、皆依条件而变，任何僵局都有松动的希望。", "source": "《佛教的见地与修道》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "空性是悲观主义的终结者，它是宇宙间最深沉的乐观主义。", "action": "面对目前最卡顿的一个项目，换一个微小的条件重新切入试试。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "龙树菩萨", "initials": "龙", "title": "真俗二谛：不坏世俗说胜义", "quote": "若不依俗谛，不得第一义；不得第一义，则不得涅槃。", "zh": "龙树菩萨提醒学人：必须尊重世俗的语言、因果、逻辑与伦理，才能以此为阶梯通达究竟的胜义空性；不可好高骛远、否定日常。", "source": "《中论》观四谛品", "url": "https://84000.co/zh-tw", "insight": "把眼前的工作、生活与人际关系踏实打理好，正是通往高远智慧的必经之路。", "action": "认真回复一封该回的邮件或整理好手边的一份文档，在世俗细节中修心。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "《维摩诘经》", "initials": "维", "title": "不二法门：默然无言的智慧", "quote": "乃至无有文字语言，是真入不二法门。", "zh": "世间争论常停留在“善恶、对错、动静、凡圣”的二元对立中；当语言概念穷尽、分别心歇息时，实相自然现前。", "source": "《维摩诘所说经》入不二法门品", "url": "https://84000.co/zh-tw", "insight": "有些深刻的理解与共鸣，发生在停止争辩之后的宁静沉默里。", "action": "今天在一次无效争论即将升温时，选择温和地保持沉默。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "连“佛性”也不要执为实体", "quote": "说佛性时，只是为了让你对净除烦恼生起信心；其实它与空性无别。", "zh": "如果你把佛性想象成胸口里一颗发光的金丹，那就又落入了常见；它其实是指心性本自清净、不受染污遮蔽的潜能与空间。", "source": "《究竟一乘宝性论讲记》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "不执着于任何神秘意象，保持开放、觉知与清明的空间感即可。", "action": "吸气时感受胸腔打开的空间感，呼气时放下紧绷的思虑。"}, {"theme": "madhyamaka", "themeLabel": "中观与空性", "author": "《金刚经》", "initials": "金", "title": "若见诸相非相，即见如来", "quote": "不取于相，如如不动。", "zh": "并不是要求你闭上眼睛不看世界，而是在面对各种赞美、诱惑、惊吓与变化时，内心不被表象勾走，保持如如不动的清明。", "source": "《金刚般若波罗蜜经》", "url": "https://84000.co/zh-tw", "insight": "外在可以忙碌应对千头万绪，内心深处却可以像深海一样安静不动。", "action": "在今天最忙碌的时段里，抽十秒钟觉察一下内心深处那个“如如不动”的旁观者。"}, {"theme": "path", "themeLabel": "成佛之道与戒律", "author": "《成佛之道》", "initials": "佛", "title": "三学次第：由戒生定，由定发慧", "quote": "戒能护持身语清净，定能令心专注安稳，慧能照破无明烦恼。", "zh": "戒、定、慧并非三个互不相干的科目，而是一条完整的因果链：生活有节制（戒），心才不容易散乱（定），心静了才看得清真相（慧）。", "source": "《成佛之道全集讲义》", "url": "https://gemini.google.com/notebook/c335fe0f-2968-47c6-80ad-289bc8b17eb7", "insight": "如果觉得最近脑子乱、看不清方向，往往先从整理作息与减少消耗（戒）开始最有效。", "action": "今晚早睡半小时，减少睡前刷屏，用“戒”来滋养明天的“定”与“慧”。"}, {"theme": "path", "themeLabel": "成佛之道与戒律", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "供养与积聚福德的意义", "quote": "积聚福德并非贿赂佛陀，而是借由慷慨松动自己吝啬与狭窄的习气。", "zh": "佛陀不需要我们的供品或赞美；当我们练习把好东西分享出去、真诚赞叹他人时，真正受益的是那颗逐渐变得宽广柔软的自己的心。", "source": "《不是为了快乐》", "url": "https://khyentsefoundation.org/chs/collections/words-from-rinpoche-chs-2/", "insight": "慷慨是打破匮乏感最快的方法：当你敢于给予，潜意识就相信自己是丰盛的。", "action": "今天把一件好用的工具、一首好歌或一条有用的信息真诚分享给朋友。"}, {"theme": "path", "themeLabel": "成佛之道与戒律", "author": "《阿含经》", "initials": "阿", "title": "正语的四个标准", "quote": "真实、柔和、有益、适时——具足此四者方为正语。", "zh": "哪怕一句话是“真话”，但如果带着恶意（不柔和）、毫无用处（无益）或在对方情绪崩溃时说出（不适时），依然不是善巧的正语。", "source": "《中部》 · 《成佛之道》", "url": "https://84000.co/zh-tw", "insight": "真正的坦诚总是带着善意与分寸感，而不是把“我说话直”当成伤人的借口。", "action": "今天给别人提建议前，用“真实、柔和、有益、适时”四条标准先过滤一遍。"}, {"theme": "path", "themeLabel": "成佛之道与戒律", "author": "寂天菩萨", "initials": "寂", "title": "精进：对善法的欢喜心", "quote": "精进并非咬牙切齿的苦熬，而是对善行与成长生起由衷的欢喜。", "zh": "把修行或工作当成苦差事，很快就会 初探》", "url": "https://religion.tcu.edu.tw/wp-content/uploads/2025/10/%E3%80%90%E6%9C%83%E5%BE%8C%E4%BF%AE%E8%A8%82%E3%80%914-A1_%E9%87%8B%E8%80%80%E7%B7%A3%E9%87%8B%E8%81%96%E5%9B%A0_%E4%BA%BA%E5%B7%A5%E6%99%BA%E6%85%A7%EF%BC%88AI%EF%BC%89%E6%99%82%E4%BB%A3%E4%B8%8B%E4%BD%9B%E6%95%99%E5%BC%98%E5%8C%96%E8%AE%8A%E9%9D%A9%E3%80%81%E6%A9%9F%E9%81%87%E8%88%87%E6%87%89%E5%B0%8D%E5%88%9D%E6%8E%A2.pdf", "insight": "线上汲取养分，线下扎根结果，两者结合才不会沦为空谈。", "action": "把今天在屏幕前读到的这份清净感，带到待会儿见到第一个人的微笑里。"}, {"theme": "mindful", "themeLabel": "生死觉知与AI时代", "author": "宗萨钦哲仁波切", "initials": "宗", "title": "带着觉知过好今天", "quote": "活着的时候修持正念与善良，就是对未知未来最好的准备。", "zh": "不必为遥远不可测的未来过度焦虑，也不用为已经翻篇的昨天反复懊悔；照顾好当下的这一念清净与慈悲，未来自然会水到渠成。", "source": "《活着即是迈向死亡》", "url": "https://khyentsefoundation.org/chs/resource/book_movie/living-is-dying-how-to-prepare-for-death-dying-and-beyond/", "insight": "把每一天都当成完整的一生来用心度过，便无愧于此生。", "action": "睡前合眼时，对今天所经历的一切因缘道一声感恩，安心入眠。"}];

    const CHECKLIST = [
      "无常观照：今天是否提醒自己‘一切和合事物皆无常’，从而少了一点执着与焦虑？",
      "知苦不嗔：遇到不顺时，是否止住了抱怨（第二支箭），只如实面对眼前的事实？",
      "无我松绑：被评价或遇到冲突时，是否觉察到‘我’只是一个暂时的标签，没有急于防卫？",
      "慈悲发心：在日常沟通或帮助他人时，是否出于真诚善意，而非求回报或自我标榜？",
      "正语威仪：线上聊天与线下交谈中，是否守住了‘真实、柔和、有益、适时’？",
      "媒介静默：使用手机或 AI 工具时，是否留出了放下屏幕、回到呼吸与独立思考的静默时间？",
      "闻思修合一：今天读到的智慧，是否写下了自己的感悟并在生活中实际运用了一次？"
    ];

    const START_YEAR = 2026, START_MONTH = 10; // Nov 2026 (0-indexed)
    const TOTAL_MONTHS = 37; // Nov 2026 -> Nov 2029

    const pad = n => String(n).padStart(2, "0");
    const fmtDate = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

    const realNow = new Date();
    const realIso = fmtDate(realNow.getFullYear(), realNow.getMonth(), realNow.getDate());
    const DEFAULT_TODAY = (realIso >= "2026-11-01" && realIso <= "2029-11-30") ? realIso : "2026-11-18";

    let curYear = Number(DEFAULT_TODAY.slice(0, 4));
    let curMonth = Number(DEFAULT_TODAY.slice(5, 7)) - 1;
    let selectedDate = DEFAULT_TODAY;
    let themeFilter = "all";
    let authorFilter = "all";
    let onlyFavs = false;
    let query = "";

    const favs = new Set(JSON.parse(localStorage.getItem("buddha3_favs") || "[]"));
    const reads = new Set(JSON.parse(localStorage.getItem("buddha3_reads") || "[]"));
    const notes = JSON.parse(localStorage.getItem("buddha3_notes") || "{}");
    const checks = JSON.parse(localStorage.getItem("buddha3_checks") || "{}");

    if (localStorage.getItem("buddha3_ui") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }

    function save() {
      localStorage.setItem("buddha3_favs", JSON.stringify([...favs]));
      localStorage.setItem("buddha3_reads", JSON.stringify([...reads]));
      localStorage.setItem("buddha3_notes", JSON.stringify(notes));
    }

    function dayIndex(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const t1 = Date.UTC(2026, 10, 1);
      const t2 = Date.UTC(y, m - 1, d);
      return Math.floor((t2 - t1) / 86400000);
    }

    function itemFor(iso) {
      const idx = ((dayIndex(iso) % DATA.length) + DATA.length) % DATA.length;
      return DATA[idx];
    }

    function matchesFilters(item, iso) {
      if (themeFilter !== "all" && item.theme !== themeFilter) return false;
      if (authorFilter !== "all") {
        const hay = `${item.author} ${item.source} ${item.title}`;
        if (authorFilter === "菩萨") {
          if (!/龙树|月称|寂天|帝洛巴|太虚/.test(hay)) return false;
        } else if (authorFilter === "经") {
          if (!/经》|论》/.test(hay)) return false;
        } else if (!hay.includes(authorFilter)) {
          return false;
        }
      }
      if (onlyFavs && !favs.has(iso)) return false;
      if (query.trim()) {
        const q = query.trim().toLowerCase();
        const text = `${item.title} ${item.quote} ${item.zh} ${item.author} ${item.source} ${item.insight} ${item.action}`.toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    }

    function initMonthSelect() {
      const sel = document.getElementById("monthSelect");
      sel.innerHTML = "";
      for (let i = 0; i < TOTAL_MONTHS; i++) {
        const d = new Date(START_YEAR, START_MONTH + i, 1);
        const y = d.getFullYear(), m = d.getMonth();
        const opt = document.createElement("option");
        opt.value = `${y}-${m}`;
        opt.textContent = `${y} 年 ${m + 1} 月`;
        if (y === curYear && m === curMonth) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.onchange = () => {
        const [y, m] = sel.value.split("-").map(Number);
        curYear = y; curMonth = m;
        renderGrid();
      };
    }

    function renderGrid() {
      const grid = document.getElementById("calGrid");
      const firstDay = new Date(curYear, curMonth, 1).getDay();
      const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
      document.getElementById("monthSelect").value = `${curYear}-${curMonth}`;

      let html = "";
      for (let i = 0; i < firstDay; i++) html += `<div class="day-empty"></div>`;

      let matchCount = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = fmtDate(curYear, curMonth, d);
        const item = itemFor(iso);
        const ok = matchesFilters(item, iso);
        if (ok) matchCount++;
        const isSel = iso === selectedDate;
        const isToday = iso === DEFAULT_TODAY;
        const isFav = favs.has(iso);
        const isRead = reads.has(iso);
        const hasNote = Boolean(notes[iso] && notes[iso].trim());
        const dotColor = `var(--${item.theme})`;
        html += `
          <div class="day-cell ${isSel ? "selected" : ""} ${isToday ? "today" : ""} ${ok ? "" : "dimmed"}" data-iso="${iso}">
            <div class="day-top">
              <span class="day-num">${d}</span>
              <span class="day-marks">
                ${isFav ? '<span style="color:var(--accent)">★</span>' : ""}
                ${hasNote ? '<span title="有笔记">✎</span>' : ""}
                ${isRead ? '<span style="color:var(--path)">✓</span>' : ""}
                <span class="theme-dot" style="background:${dotColor}"></span>
              </span>
            </div>
            <div class="day-snippet">${item.title}</div>
          </div>`;
      }
      grid.innerHTML = html;
      document.getElementById("monthSummary").textContent = `本月匹配 ${matchCount} / ${daysInMonth} 天`;
      document.getElementById("readStat").textContent = `已读 ${reads.size} 天`;
      document.getElementById("favStat").textContent = `收藏 ${favs.size} 条`;

      grid.querySelectorAll(".day-cell").forEach(el => {
        el.onclick = () => {
          selectedDate = el.dataset.iso;
          renderGrid();
          renderReader();
        };
      });
    }

    function renderReader() {
      const panel = document.getElementById("readerPanel");
      const item = itemFor(selectedDate);
      const isFav = favs.has(selectedDate);
      const isRead = reads.has(selectedDate);
      const [y, m, d] = selectedDate.split("-").map(Number);
      const wd = ["日", "一", "二", "三", "四", "五", "六"][new Date(y, m - 1, d).getDay()];

      panel.innerHTML = `
        <div class="reader-meta">
          <span class="date-badge">${y}年${m}月${d}日 · 星期${wd} · 第 ${dayIndex(selectedDate) + 1} 天</span>
          <span class="theme-badge t-${item.theme}">${item.themeLabel}</span>
        </div>
        <h2 class="reader-title">${item.title}</h2>
        <div class="quote-box">
          <p class="quote-orig">「${item.quote}」</p>
          <p class="quote-zh">${item.zh}</p>
        </div>
        <div class="author-row">
          <div class="author-info">
            <div class="avatar">${item.initials}</div>
            <div>
              <div class="author-name">${item.author}</div>
              <div class="source-name">${item.source}</div>
            </div>
          </div>
          <a class="btn" href="${item.url}" target="_blank" rel="noopener noreferrer">查看出处 ↗</a>
        </div>
        <div class="card-grid">
          <div class="info-card">
            <div class="info-label">法义洞察</div>
            <p class="info-text">${item.insight}</p>
          </div>
          <div class="info-card">
            <div class="info-label">今日正念践行</div>
            <p class="info-text">${item.action}</p>
          </div>
        </div>
        <div class="note-box">
          <div class="note-label">
            <span>当日修习随笔（自动保存于本地）</span>
            <span id="noteSaved"></span>
          </div>
          <textarea id="noteInput" placeholder="写下你今天对这句法语的体悟或觉察...">${notes[selectedDate] || ""}</textarea>
        </div>
        <div class="reader-actions">
          <div class="action-left">
            <button class="btn ${isFav ? "active" : ""}" id="favBtn">${isFav ? "★ 已收藏" : "☆ 收藏"}</button>
            <button class="btn ${isRead ? "active" : ""}" id="readBtn">${isRead ? "✓ 已读" : "标记已读"}</button>
            <button class="btn" id="copyBtn">复制法语</button>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="icon-btn" id="prevDayBtn" title="前一天 (←)">‹</button>
            <button class="icon-btn" id="nextDayBtn" title="后一天 (→)">›</button>
          </div>
        </div>
      `;

      document.getElementById("favBtn").onclick = () => {
        if (favs.has(selectedDate)) favs.delete(selectedDate);
        else favs.add(selectedDate);
        save(); renderGrid(); renderReader();
      };
      document.getElementById("readBtn").onclick = () => {
        if (reads.has(selectedDate)) reads.delete(selectedDate);
        else reads.add(selectedDate);
        save(); renderGrid(); renderReader();
      };
      document.getElementById("copyBtn").onclick = async () => {
        const txt = `【${selectedDate} · ${item.title}】\n「${item.quote}」\n${item.zh}\n—— ${item.author}（${item.source}）\n今日践行：${item.action}`;
        try {
          await navigator.clipboard.writeText(txt);
          document.getElementById("copyBtn").textContent = "✓ 已复制";
          setTimeout(() => document.getElementById("copyBtn").textContent = "复制法语", 1500);
        } catch {}
      };
      document.getElementById("noteInput").addEventListener("input", e => {
        notes[selectedDate] = e.target.value;
        save();
        document.getElementById("noteSaved").textContent = "已保存";
        renderGrid();
      });
      document.getElementById("prevDayBtn").onclick = () => stepDate(-1);
      document.getElementById("nextDayBtn").onclick = () => stepDate(1);
    }

    function stepDate(delta) {
      const [y, m, d] = selectedDate.split("-").map(Number);
      const next = new Date(y, m - 1, d + delta);
      const iso = fmtDate(next.getFullYear(), next.getMonth(), next.getDate());
      if (iso < "2026-11-01" || iso > "2029-11-30") return;
      selectedDate = iso;
      curYear = next.getFullYear();
      curMonth = next.getMonth();
      renderGrid();
      renderReader();
    }

    document.getElementById("prevMonthBtn").onclick = () => {
      const idx = (curYear - START_YEAR) * 12 + (curMonth - START_MONTH) - 1;
      if (idx < 0) return;
      const d = new Date(START_YEAR, START_MONTH + idx, 1);
      curYear = d.getFullYear(); curMonth = d.getMonth();
      renderGrid();
    };

    document.getElementById("nextMonthBtn").onclick = () => {
      const idx = (curYear - START_YEAR) * 12 + (curMonth - START_MONTH) + 1;
      if (idx >= TOTAL_MONTHS) return;
      const d = new Date(START_YEAR, START_MONTH + idx, 1);
      curYear = d.getFullYear(); curMonth = d.getMonth();
      renderGrid();
    };

    document.getElementById("todayBtn").onclick = () => {
      selectedDate = DEFAULT_TODAY;
      curYear = Number(DEFAULT_TODAY.slice(0, 4));
      curMonth = Number(DEFAULT_TODAY.slice(5, 7)) - 1;
      renderGrid();
      renderReader();
    };

    document.querySelectorAll("#themeFilters .chip").forEach(c => {
      c.onclick = () => {
        document.querySelectorAll("#themeFilters .chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        themeFilter = c.dataset.theme;
        renderGrid();
      };
    });

    document.querySelectorAll("#authorFilters .chip").forEach(c => {
      c.onclick = () => {
        document.querySelectorAll("#authorFilters .chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        authorFilter = c.dataset.author;
        renderGrid();
      };
    });

    document.getElementById("favFilterBtn").onclick = function () {
      onlyFavs = !onlyFavs;
      this.classList.toggle("active", onlyFavs);
      renderGrid();
    };

    document.getElementById("searchInput").addEventListener("input", e => {
      query = e.target.value;
      renderGrid();
    });

    document.getElementById("themeBtn").onclick = () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      localStorage.setItem("buddha3_ui", dark ? "light" : "dark");
    };

    function renderChecklist() {
      const body = document.getElementById("checklistBody");
      body.innerHTML = CHECKLIST.map((t, i) => `
        <label class="check-row">
          <input type="checkbox" ${checks[i] ? "checked" : ""} data-i="${i}" />
          <span style="font-size: 0.9rem; line-height:1.5;">${t}</span>
        </label>
      `).join("");
      body.querySelectorAll("input").forEach(inp => {
        inp.onchange = () => {
          checks[inp.dataset.i] = inp.checked;
          localStorage.setItem("buddha3_checks", JSON.stringify(checks));
        };
      });
    }

    document.getElementById("checklistBtn").onclick = () => {
      renderChecklist();
      document.getElementById("checklistModal").classList.add("open");
    };

    document.getElementById("closeModalBtn").onclick = () => {
      document.getElementById("checklistModal").classList.remove("open");
    };

    document.getElementById("checklistModal").onclick = e => {
      if (e.target.id === "checklistModal") e.target.classList.remove("open");
    };

    document.addEventListener("keydown", e => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowLeft") stepDate(-1);
      if (e.key === "ArrowRight") stepDate(1);
      if (e.key.toLowerCase() === "f") {
        if (favs.has(selectedDate)) favs.delete(selectedDate);
        else favs.add(selectedDate);
        save(); renderGrid(); renderReader();
      }
    });

    initMonthSelect();
    renderGrid();
    renderReader();
  </script>
</body>
</html>
